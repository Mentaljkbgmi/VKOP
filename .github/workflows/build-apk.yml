            Future<String?> buildHslLutFile() async {
              final changed = List.generate(8, (i) => hslHue[i].abs() + hslSaturation[i].abs() + hslLightness[i].abs() > .01).any((v) => v);
              if (!changed) return null;
              const size = 17;
              final lines = <String>['TITLE "VKOP HSL Adjustment"', 'LUT_3D_SIZE 17', 'DOMAIN_MIN 0.0 0.0 0.0', 'DOMAIN_MAX 1.0 1.0 1.0'];
              const centers = [0.0, 30.0, 60.0, 120.0, 180.0, 240.0, 275.0, 320.0];
              for (var b = 0; b < size; b++) {
                for (var g = 0; g < size; g++) {
                  for (var r = 0; r < size; r++) {
                    final color = Color.fromARGB(255, (r * 255 / (size - 1)).round(), (g * 255 / (size - 1)).round(), (b * 255 / (size - 1)).round());
                    final hsl = HSLColor.fromColor(color);
                    var hueShift = 0.0; var satShift = 0.0; var lightShift = 0.0; var totalWeight = 0.0;
                    for (var i = 0; i < 8; i++) {
                      var distance = (hsl.hue - centers[i]).abs();
                      if (distance > 180) distance = 360 - distance;
                      final weight = (1 - distance / 32).clamp(0.0, 1.0).toDouble();
                      hueShift += hslHue[i] * weight;
                      satShift += hslSaturation[i] * weight;
                      lightShift += hslLightness[i] * weight;
                      totalWeight += weight;
                    }
                    if (totalWeight > 0) {
                      final adjusted = HSLColor.fromAHSL(1,
                        (hsl.hue + hueShift / totalWeight + 360) % 360,
                        (hsl.saturation * (1 + satShift / totalWeight / 100)).clamp(0.0, 1.0).toDouble(),
                        (hsl.lightness + lightShift / totalWeight / 100).clamp(0.0, 1.0).toDouble()).toColor();
                      lines.add((adjusted.red / 255).toStringAsFixed(6) + ' ' + (adjusted.green / 255).toStringAsFixed(6) + ' ' + (adjusted.blue / 255).toStringAsFixed(6));
                    } else {
                      lines.add((r / (size - 1)).toStringAsFixed(6) + ' ' + (g / (size - 1)).toStringAsFixed(6) + ' ' + (b / (size - 1)).toStringAsFixed(6));
                    }
                  }
                }
              }
              final dir = await getTemporaryDirectory();
              final file = File(dir.path + '/vkop_hsl_adjustment.cube');
              await file.writeAsString(lines.join('\n'));
              return file.path;
            }

            List<double> get previewColorMatrix {
              final s = saturation;
              final c = contrast;
              final b = (brightness + exposure * .5) * 255;
              const r = .213, g = .715, bl = .072;
              final sr = (1 - s) * r, sg = (1 - s) * g, sb = (1 - s) * bl;
              final warm = (filter == 'Warm' ? 1.08 : 1.0) + temperature * .001;
              final tintPreview = tint * .0008;
              final mono = filter == 'B&W' ? 0.0 : 1.0;
              final sat = s * mono;
              final rr = (1 - sat) * r, gg = (1 - sat) * g, bb = (1 - sat) * bl;
              return [
                (rr + sat) * c * warm, (gg) * c, (bb) * c, 0, b,
                (rr) * c, (gg + sat) * c * warm, (bb) * c, 0, b,
                (rr) * c, (gg) * c, (bb + sat) * c * warm, 0, b,
                0, 0, 0, 1, 0,
              ];
            }

