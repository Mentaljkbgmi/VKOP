              sequenceTimer?.cancel(); player?.dispose(); for (final c in overlayPlayers.values) { c.dispose(); } textController.dispose(); super.dispose();
            }

            @override
            Widget build(BuildContext context) => Scaffold(
              appBar: AppBar(title: const Text('VKOP EDITOR', style: TextStyle(fontWeight: FontWeight.w900, letterSpacing: 1.2, fontSize: 16)), leading: IconButton(icon: const Icon(Icons.arrow_back), onPressed: () => Navigator.pop(context)), actions: [IconButton(onPressed: addOverlay, icon: const Icon(Icons.layers_outlined), tooltip: 'Add overlay')]),
