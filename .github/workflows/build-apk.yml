name: Build VKOP Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --org com.vkop --project-name ai --platforms android app
        
      - name: Set VKOP app name
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:label="ai"', 'android:label="VKOP"')
          s = s.replace('android:label="app"', 'android:label="VKOP"')
          p.write_text(s)

          assert 'android:label="VKOP"' in s, "VKOP app label was not set!"
          print("Launcher name successfully set to VKOP")
          PY

          
      
      - name: Add video picker dependency
        working-directory: app
        run: flutter pub add file_picker

      - name: Create VKOP video import screen
        run: |
          cat > app/lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'package:file_picker/file_picker.dart';

          void main() => runApp(const VKOPApp());

          class VKOPApp extends StatelessWidget {
            const VKOPApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'VKOP',
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF101018),
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: Colors.deepPurpleAccent,
                    brightness: Brightness.dark,
                  ),
                ),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            String videoName = 'No video selected';

            Future<void> pickVideo() async {
              final result = await FilePicker.platform.pickFiles(
                type: FileType.video,
              );

              if (result != null && result.files.isNotEmpty) {
                setState(() {
                  videoName = result.files.first.name;
                });
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text(
                    'VKOP',
                    style: TextStyle(
                      fontWeight: FontWeight.bold,
                      letterSpacing: 3,
                    ),
                  ),
                  centerTitle: true,
                ),
                body: Center(
                  child: Padding(
                    padding: const EdgeInsets.all(24),
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        const Icon(
                          Icons.auto_awesome,
                          size: 75,
                          color: Colors.deepPurpleAccent,
                        ),
                        const SizedBox(height: 20),
                        const Text(
                          'Remove. Replace. Create.',
                          textAlign: TextAlign.center,
                          style: TextStyle(
                            fontSize: 24,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        const SizedBox(height: 10),
                        const Text(
                          'AI VIDEO BACKGROUND REMOVER',
                          style: TextStyle(
                            color: Colors.white54,
                            letterSpacing: 2,
                            fontSize: 11,
                          ),
                        ),
                        const SizedBox(height: 45),
                        const Icon(
                          Icons.video_library_outlined,
                          size: 65,
                          color: Colors.deepPurpleAccent,
                        ),
                        const SizedBox(height: 20),
                        const Text('Choose your video'),
                        const SizedBox(height: 20),
                        SizedBox(
                          width: double.infinity,
                          child: FilledButton.icon(
                            onPressed: pickVideo,
                            icon: const Icon(Icons.add),
                            label: const Text('IMPORT VIDEO'),
                          ),
                        ),
                        const SizedBox(height: 25),
                        Text(
                          videoName,
                          textAlign: TextAlign.center,
                          style: const TextStyle(color: Colors.white70),
                        ),
                        const SizedBox(height: 45),
                        const Text(
                          'FREE  •  OFFLINE  •  NO WATERMARK',
                          style: TextStyle(
                            color: Colors.white38,
                            fontSize: 10,
                            letterSpacing: 1,
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          EOF

      
      - name: Build APK
        working-directory: app
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --verbose 2>&1 | tee build-log.txt


      - name: Upload Build Error Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VKOP-Build-Log
          path: app/build-log.txt
          if-no-files-found: ignore



      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VKOP-Android-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
          
