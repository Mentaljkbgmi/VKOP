name: Build VKOP Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project
        run: flutter create --org com.vkop --project-name ai --platforms android app

      - name: Set Android app name
        run: |
          sed -i 's/android:label="ai"/android:label="VKOP"/' app/android/app/src/main/AndroidManifest.xml

      - name: Install Flutter packages
        working-directory: app
        run: |
          flutter pub add file_picker
          flutter pub add video_player
          flutter pub add just_audio
          flutter pub add audio_session
          flutter pub add path_provider

      - name: Add FFmpeg Android dependency
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              raise SystemExit("Expected app/build.gradle.kts was not found.")
          content = gradle.read_text()
          dependency = 'implementation("dev.ffmpegkit-maintained:ffmpeg-kit-full:8.1.9")'
          if dependency not in content:
              content += "\n\ndependencies {\n    " + dependency + "\n}\n"
          gradle.write_text(content)
          print("FFmpeg dependency added.")
          PY

      - name: Create FFmpeg Kotlin bridge
        working-directory: app
        run: |
          mkdir -p android/app/src/main/kotlin/com/vkop/ai
          cat > android/app/src/main/kotlin/com/vkop/ai/MainActivity.kt <<'EOF'
          package com.vkop.ai

          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import io.flutter.plugin.common.EventChannel
          import com.arthenica.ffmpegkit.FFmpegKit
          import com.arthenica.ffmpegkit.ReturnCode
          import android.content.ContentValues
          import android.graphics.Bitmap
          import android.media.MediaMetadataRetriever
          import java.io.ByteArrayOutputStream
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import java.io.File

          class MainActivity : FlutterActivity() {
              private val channelName = "com.vkop.ai/ffmpeg"
              private var progressSink: EventChannel.EventSink? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  EventChannel(flutterEngine.dartExecutor.binaryMessenger, "com.vkop.ai/ffmpeg_progress")
                      .setStreamHandler(object : EventChannel.StreamHandler {
                          override fun onListen(arguments: Any?, events: EventChannel.EventSink?) { progressSink = events }
                          override fun onCancel(arguments: Any?) { progressSink = null }
                      })
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "com.vkop.ai/media")
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "videoThumbnail" -> {
                                  val path = call.argument<String>("path")
                                  if (path.isNullOrBlank()) {
                                      result.error("INVALID_PATH", "Video path is missing.", null)
                                      return@setMethodCallHandler
                                  }
                                  val retriever = MediaMetadataRetriever()
                                  try {
                                      retriever.setDataSource(path)
                                      val bitmap = retriever.getFrameAtTime(1_000_000, MediaMetadataRetriever.OPTION_CLOSEST_SYNC)
                                          ?: retriever.getFrameAtTime(0)
                                          ?: throw IllegalStateException("No video frame available.")
                                      val bytes = ByteArrayOutputStream()
                                      bitmap.compress(Bitmap.CompressFormat.JPEG, 82, bytes)
                                      bitmap.recycle()
                                      result.success(bytes.toByteArray())
                                  } catch (e: Exception) {
                                      result.error("THUMBNAIL_FAILED", e.message ?: "Could not create video thumbnail.", null)
                                  } finally {
                                      try { retriever.release() } catch (_: Exception) {}
                                  }
                              }
                              else -> result.notImplemented()
                          }
                      }
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "execute" -> {
                                  val arguments = call.argument<List<String>>("arguments")
                                  if (arguments.isNullOrEmpty()) {
                                      result.error("INVALID_ARGUMENTS", "FFmpeg arguments are missing.", null)
                                      return@setMethodCallHandler
                                  }
                                  val reportProgress = call.argument<Boolean>("reportProgress") ?: false
                                  FFmpegKit.executeWithArgumentsAsync(arguments.toTypedArray(), { session ->
                                      val output = session.output ?: ""
                                      val success = ReturnCode.isSuccess(session.returnCode)
                                      runOnUiThread {
                                          if (success) result.success(output)
                                          else result.error(
                                              "FFMPEG_FAILED",
                                              output.ifBlank { "FFmpeg execution failed." },
                                              session.returnCode?.toString()
                                          )
                                      }
                                  }, null, { statistics ->
                                      if (reportProgress) {
                                          val processedMs = statistics.time
                                          runOnUiThread { progressSink?.success(processedMs) }
                                      }
                                  })
                              }
                              "saveAudioToDownloads" -> {
                                  val sourcePath = call.argument<String>("sourcePath")
                                  val fileName = call.argument<String>("fileName")
                                  if (sourcePath.isNullOrBlank() || fileName.isNullOrBlank()) {
                                      result.error("INVALID_ARGUMENTS", "Audio source path or file name is missing.", null)
                                      return@setMethodCallHandler
                                  }
                                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                                      result.error("UNSUPPORTED_ANDROID", "Saving audio to Music/VKOP requires Android 10 or newer.", null)
                                      return@setMethodCallHandler
                                  }
                                  try {
                                      val values = ContentValues().apply {
                                          put(MediaStore.MediaColumns.DISPLAY_NAME, fileName)
                                          put(MediaStore.MediaColumns.MIME_TYPE, "audio/mp4")
                                          put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_MUSIC + "/VKOP")
                                          put(MediaStore.MediaColumns.IS_PENDING, 1)
                                      }
                                      val uri = contentResolver.insert(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, values)
                                          ?: throw IllegalStateException("Could not create audio file in Music/VKOP.")
                                      contentResolver.openOutputStream(uri)?.use { output ->
                                          File(sourcePath).inputStream().use { input -> input.copyTo(output) }
                                      } ?: throw IllegalStateException("Could not open output audio stream.")
                                      values.clear()
                                      values.put(MediaStore.MediaColumns.IS_PENDING, 0)
                                      contentResolver.update(uri, values, null, null)
                                      result.success(uri.toString())
                                  } catch (e: Exception) {
                                      result.error("SAVE_FAILED", e.message ?: "Could not save extracted audio.", null)
                                  }
                              }
                              "saveToDownloads" -> {
                                  val sourcePath = call.argument<String>("sourcePath")
                                  val fileName = call.argument<String>("fileName")
                                  if (sourcePath.isNullOrBlank() || fileName.isNullOrBlank()) {
                                      result.error("INVALID_ARGUMENTS", "Source path or file name is missing.", null)
                                      return@setMethodCallHandler
                                  }
                                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                                      result.error("UNSUPPORTED_ANDROID", "Saving to Movies/VKOP requires Android 10 or newer.", null)
                                      return@setMethodCallHandler
                                  }
                                  try {
                                      val values = ContentValues().apply {
                                          put(MediaStore.MediaColumns.DISPLAY_NAME, fileName)
                                          put(MediaStore.MediaColumns.MIME_TYPE, "video/mp4")
                                          put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_MOVIES + "/VKOP")
                                          put(MediaStore.MediaColumns.IS_PENDING, 1)
                                      }
                                      val uri = contentResolver.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, values)
                                          ?: throw IllegalStateException("Could not create video in Movies/VKOP.")
                                      contentResolver.openOutputStream(uri)?.use { output ->
                                          File(sourcePath).inputStream().use { input -> input.copyTo(output) }
                                      } ?: throw IllegalStateException("Could not open output video stream.")
                                      values.clear()
                                      values.put(MediaStore.MediaColumns.IS_PENDING, 0)
                                      contentResolver.update(uri, values, null, null)
                                      result.success(uri.toString())
                                  } catch (e: Exception) {
                                      result.error("SAVE_FAILED", e.message ?: "Could not save exported video.", null)
                                  }
                              }
                              else -> result.notImplemented()
                          }
                      }
              }
          }
          EOF

      - name: Create VKOP Editor
        working-directory: app
        run: |
          cat > lib/main.dart <<'EOF'
          import 'dart:async';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:video_player/video_player.dart';
          import 'package:just_audio/just_audio.dart';
          import 'package:audio_session/audio_session.dart';
          import 'dart:typed_data';
          import 'dart:ui' as ui;
          import 'package:path_provider/path_provider.dart';

          void main() => runApp(const VKOPApp());

          const ffmpegChannel = MethodChannel('com.vkop.ai/ffmpeg');
          const ffmpegProgressChannel = EventChannel('com.vkop.ai/ffmpeg_progress');
          const mediaChannel = MethodChannel('com.vkop.ai/media');
          const purple = Color(0xFF7653D6);
          const panel = Color(0xFFF4F4F7);

          class MediaClip {
            final String path;
            final String name;
            final bool isVideo;
            final Object id = Object();
            double duration;
            double speed = 1;
            String speedMode = 'Normal';
            String curvePreset = 'Montage';
            double trimStart = 0;
            double trimEnd = 0;
            double scale = 1;
            double rotation = 0;
            double positionX = .5;
            double positionY = .5;
            double opacity = 1;
            double audioVolume = 1;
            bool audioMuted = false;
            final List<KeyframePoint> keyframes = [];

            MediaClip({required this.path, required this.name, required this.isVideo, this.duration = 3});
          }

          class KeyframePoint {
            double time;
            double scale;
            double x;
            double y;
            double opacity;
            double volume;
            KeyframePoint({required this.time, this.scale = 1, this.x = .5, this.y = .5, this.opacity = 1, this.volume = 1});
          }

          class AudioClip {
            final String path;
            final String name;
            final Object id = Object();
            double duration = 0;
            double start = 0;
            double volume = 1;
            bool muted = false;
            final List<KeyframePoint> keyframes = [];
            AudioClip({required this.path, required this.name});
          }

          class SpeedCurvePainter extends CustomPainter {
            final String preset;
            SpeedCurvePainter(this.preset);

            @override
            void paint(Canvas canvas, Size size) {
              final grid = Paint()..color = const Color(0xFFD8D1E8)..strokeWidth = 1;
              for (var i = 1; i < 4; i++) {
                final y = size.height * i / 4;
                canvas.drawLine(Offset(0, y), Offset(size.width, y), grid);
              }
              final values = switch (preset) {
                'Bullet' => [1.0, .25, .25, 1.0],
                'Jump Cut' => [1.0, 4.0, 4.0, 1.0],
                'Hero' => [1.0, .5, .5, 1.0],
                'Smooth' => [1.0, 1.5, 1.5, 1.0],
                'Flash In' => [.25, 1.0, 2.0, 4.0],
                _ => [1.0, 3.0, .5, 1.0],
              };
              final path = Path();
              for (var i = 0; i < values.length; i++) {
                final x = size.width * i / (values.length - 1);
                final normalized = (1 - (values[i] / 4)).clamp(0.05, .95).toDouble();
                final y = size.height * normalized;
                if (i == 0) { path.moveTo(x, y); } else { path.lineTo(x, y); }
                canvas.drawCircle(Offset(x, y), 3.5, Paint()..color = purple);
              }
              canvas.drawPath(path, Paint()..color = purple..style = PaintingStyle.stroke..strokeWidth = 2.5..strokeCap = StrokeCap.round);
            }

            @override
            bool shouldRepaint(covariant SpeedCurvePainter oldDelegate) => oldDelegate.preset != preset;
          }

          class OverlayClip {
            final String path;
            final String name;
            final bool isVideo;
            final Object id = Object();
            double start = 0;
            double duration = 3;
            double centerX = .5;
            double centerY = .5;
            double widthFactor = .34;
            double rotation = 0;
            double opacity = 1;
            final List<KeyframePoint> keyframes = [];
            final String kind;
            String content;
            double textSize = 30;
            Color textColor = Colors.white;
            bool textBold = true;

            OverlayClip({required this.path, required this.name, required this.isVideo, this.kind = 'media', this.content = ''});
          }

          class VKOPApp extends StatelessWidget {
            const VKOPApp({super.key});
            @override
            Widget build(BuildContext context) => MaterialApp(
              title: 'VKOP',
              debugShowCheckedModeBanner: false,
              theme: ThemeData(
                brightness: Brightness.light,
                useMaterial3: true,
                scaffoldBackgroundColor: Colors.white,
                colorScheme: ColorScheme.fromSeed(seedColor: purple, brightness: Brightness.light),
                appBarTheme: const AppBarTheme(backgroundColor: Colors.white, foregroundColor: Color(0xFF202027), elevation: 0),
              ),
              home: const VKOPHome(),
            );
          }

          class VKOPHome extends StatefulWidget {
            const VKOPHome({super.key});
            @override
            State<VKOPHome> createState() => _VKOPHomeState();
          }

          class _VKOPHomeState extends State<VKOPHome> {
            final List<MediaClip> selected = [];
            final Map<String, Future<Uint8List?>> thumbnailCache = {};
            Future<Uint8List?> videoThumbnail(String path) => thumbnailCache.putIfAbsent(path, () => mediaChannel.invokeMethod<Uint8List>('videoThumbnail', {'path': path}));
            static const videoExt = {'mp4','m4v','mov','3gp','3gpp','mkv','webm','avi','ts','mts','m2ts','mpg','mpeg','wmv','flv','ogv'};
            static const imageExt = {'jpg','jpeg','png','webp','gif','bmp','wbmp','heic','heif','avif','tif','tiff'};

            Future<void> chooseMedia() async {
              try {
                final result = await FilePicker.pickFiles(type: FileType.media);
                if (result.isEmpty) return;
                final additions = <MediaClip>[];
                for (final file in result) {
                  if (file.path == null) continue;
                  final ext = (file.extension ?? '').toLowerCase();
                  final isVideo = videoExt.contains(ext);
                  if (!isVideo && !imageExt.contains(ext)) continue;
                  if (selected.any((e) => e.path == file.path) || additions.any((e) => e.path == file.path)) continue;
                  additions.add(MediaClip(path: file.path!, name: file.name, isVideo: isVideo));
                }
                if (!mounted) return;
                setState(() => selected.addAll(additions));
                if (additions.isEmpty) message('No new supported media selected.');
              } catch (e) { message('Could not select media: $e'); }
            }

            void message(String value) {
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(value)));
            }

            void openEditor() {
              if (selected.isEmpty) { message('Please select photos, videos or GIFs first.'); return; }
              Navigator.push(context, MaterialPageRoute(builder: (_) => VKOPEditor(initialClips: List.of(selected))));
            }

            @override
            Widget build(BuildContext context) => Scaffold(
              appBar: AppBar(title: const Text('VKOP', style: TextStyle(fontWeight: FontWeight.w900, letterSpacing: 2)), centerTitle: true),
              body: SafeArea(child: Padding(
                padding: const EdgeInsets.all(18),
                child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                  const SizedBox(height: 12),
                  const Text('Create a new project', style: TextStyle(fontSize: 26, fontWeight: FontWeight.bold)),
                  const SizedBox(height: 6),
                  const Text('Select photos, videos and GIFs to start editing.', style: TextStyle(color: Colors.black54)),
                  const SizedBox(height: 22),
                  InkWell(onTap: chooseMedia, borderRadius: BorderRadius.circular(18), child: Container(
                    width: double.infinity, padding: const EdgeInsets.symmetric(vertical: 30),
                    decoration: BoxDecoration(color: const Color(0xFFF6F2FF), borderRadius: BorderRadius.circular(18), border: Border.all(color: purple.withOpacity(.45))),
                    child: const Column(children: [Icon(Icons.add_photo_alternate_outlined, size: 48, color: purple), SizedBox(height: 10), Text('Select media', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)), SizedBox(height: 4), Text('Choose multiple photos, videos or GIFs', style: TextStyle(color: Colors.black54, fontSize: 12))]),
                  )),
                  const SizedBox(height: 20),
                  Row(mainAxisAlignment: MainAxisAlignment.spaceBetween, children: [const Text('SELECTED MEDIA', style: TextStyle(fontWeight: FontWeight.bold, letterSpacing: 1.2)), Text('${selected.length} items', style: const TextStyle(color: Colors.black54))]),
                  const SizedBox(height: 10),
                  Expanded(child: selected.isEmpty ? const Center(child: Text('Your selected media will appear here.', style: TextStyle(color: Colors.black38))) : GridView.builder(
                    gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount: 3, crossAxisSpacing: 9, mainAxisSpacing: 9, childAspectRatio: .82),
                    itemCount: selected.length,
                    itemBuilder: (context, index) {
                      final item = selected[index];
                      return Container(decoration: BoxDecoration(color: panel, borderRadius: BorderRadius.circular(12), border: Border.all(color: Colors.black12)), child: Stack(children: [
                        Positioned.fill(child: ClipRRect(borderRadius: BorderRadius.circular(12), child: item.isVideo
                          ? FutureBuilder<Uint8List?>(future: videoThumbnail(item.path), builder: (_, snapshot) => snapshot.hasData && snapshot.data != null ? Image.memory(snapshot.data!, fit: BoxFit.cover) : const Center(child: Icon(Icons.video_file, size: 38, color: Colors.black45)))
                          : Image.file(File(item.path), fit: BoxFit.cover, errorBuilder: (_, __, ___) => const Center(child: Icon(Icons.image, size: 36))))),
                        Positioned(left: 5, right: 5, bottom: 5, child: Container(padding: const EdgeInsets.all(4), decoration: BoxDecoration(color: Colors.black.withOpacity(.65), borderRadius: BorderRadius.circular(6)), child: Text(item.name, maxLines: 2, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 10, color: Colors.white)))),
                        Positioned(right: 4, top: 4, child: InkWell(onTap: () => setState(() => selected.removeAt(index)), child: const CircleAvatar(radius: 12, backgroundColor: Colors.black87, child: Icon(Icons.close, size: 15, color: Colors.white)))),
                      ]));
                    },
                  )),
                  Row(children: [Expanded(child: OutlinedButton.icon(onPressed: chooseMedia, icon: const Icon(Icons.add), label: const Text('Add more'))), const SizedBox(width: 10), Expanded(child: FilledButton.icon(onPressed: selected.isEmpty ? null : openEditor, icon: const Icon(Icons.movie_creation_outlined), label: const Text('Import to editor')))]),
                ]),
              )),
            );
          }

          class VKOPEditor extends StatefulWidget {
            final List<MediaClip> initialClips;
            const VKOPEditor({super.key, required this.initialClips});
            @override
            State<VKOPEditor> createState() => _VKOPEditorState();
          }

          class _CircleClipper extends CustomClipper<Path> {
            @override
            Path getClip(Size size) => Path()..addOval(Offset.zero & size);
            @override
            bool shouldReclip(covariant CustomClipper<Path> oldClipper) => false;
          }

          class _OvalClipper extends CustomClipper<Path> {
            @override
            Path getClip(Size size) => Path()..addOval(Offset.zero & size);
            @override
            bool shouldReclip(covariant CustomClipper<Path> oldClipper) => false;
          }

          class _VKOPEditorState extends State<VKOPEditor> {
            late List<MediaClip> clips;
            final List<OverlayClip> overlays = [];
            final List<AudioClip> audioTracks = [];
            final Map<Object, AudioPlayer> audioPlayers = {};
            final Map<Object, VideoPlayerController> overlayPlayers = {};
            final TransformationController previewTransform = TransformationController();
            VideoPlayerController? player;
            int selectedIndex = 0;
            int selectedOverlay = -1;
            int selectedAudio = -1;
            int loadToken = 0;
            int sequenceToken = 0;
            bool loading = false;
            bool playingSequence = false;
            bool _syncingTimelineLayers = false;
            bool testingFFmpeg = false;
            bool exporting = false;
            double exportProgress = 0;
            double exportTotalDuration = 1;
            StreamSubscription<dynamic>? exportProgressSubscription;
            bool extractingAudio = false;
            bool fullscreenPreview = false;
            Timer? sequenceTimer;
            String activeTool = 'Edit';
            String cropRatio = 'Original';
            String filter = 'None';
            String audioName = '';
            String exportResolution = '1080p';
            int exportFps = 60;
            double speed = 1;
            double playhead = 0;
            double? originalImageAspect;
            double? projectCanvasAspect;
            double _gestureScale = 1;
            double _gestureX = .5;
            double _gestureY = .5;
            double _gestureRotation = 0;
            Offset _gestureFocal = Offset.zero;
            final TextEditingController textController = TextEditingController();
            String overlayText = '';
            String selectedSticker = '';
            String textColorName = 'White';
            double textSize = 30;
            bool textBold = true;
            String selectedTextFont = 'Roboto';
            String selectedTextTemplate = 'Classic';
            String textAnimationPreset = 'None';
            double brightness = 0;
            double contrast = 1;
            double saturation = 1;
            String adjustmentTab = 'Basic';
            String selectedHslColor = 'Red';
            final List<double> hslHue = List<double>.filled(8, 0);
            final List<double> hslSaturation = List<double>.filled(8, 0);
            final List<double> hslLightness = List<double>.filled(8, 0);
            double temperature = 0;
            double tint = 0;
            double exposure = 0;
            double highlights = 0;
            double shadows = 0;
            double whites = 0;
            double blacks = 0;
            double brilliance = 0;
            double sharpen = 0;
            double clarity = 0;
            double grain = 0;
            double fadeAmount = 0;
            double vignette = 0;
            String curvesPreset = 'Linear';
            String curvesChannel = 'RGB';
            double shadowWheelR = 0;
            double shadowWheelG = 0;
            double shadowWheelB = 0;
            double midWheelR = 0;
            double midWheelG = 0;
            double midWheelB = 0;
            double highWheelR = 0;
            double highWheelG = 0;
            double highWheelB = 0;
            double wheelOffset = 0;
            double adjustmentOpacity = 1;
            String adjustmentMask = 'None';
            String customLutPath = '';
            String backgroundColorName = 'Black';
            String maskShape = 'None';
            String animationPreset = 'None';
            String stylePreset = 'None';
            bool chromaKeyEnabled = false;
            double chromaSimilarity = .25;
            double chromaBlend = .05;
            double motionBlurAmount = 0;
            String voiceEffect = 'Normal';
            bool noiseReductionEnabled = false;
            bool showGrid = false;

            MediaClip? get current => clips.isEmpty || selectedIndex < 0 || selectedIndex >= clips.length ? null : clips[selectedIndex];
            double get projectTime => clips.take(selectedIndex < 0 ? 0 : selectedIndex).fold<double>(0, (sum, c) => sum + ((c.isVideo && c.trimEnd > c.trimStart ? c.trimEnd - c.trimStart : c.duration) / c.speed.clamp(.1, 16))) + (playhead / (current?.speed ?? 1).clamp(.1, 16));
            OverlayClip? get currentOverlay => selectedOverlay < 0 || selectedOverlay >= overlays.length ? null : overlays[selectedOverlay];
            AudioClip? get currentAudio => selectedAudio < 0 || selectedAudio >= audioTracks.length ? null : audioTracks[selectedAudio];

            @override
            void initState() {
              super.initState();
              configureAudioSession();
              exportProgressSubscription = ffmpegProgressChannel.receiveBroadcastStream().listen((value) {
                if (!mounted || !exporting || value is! num) return;
                setState(() => exportProgress = (value.toDouble() / 1000 / exportTotalDuration).clamp(0.0, 0.99).toDouble());
              });
              clips = List.of(widget.initialClips);
              WidgetsBinding.instance.addPostFrameCallback((_) { if (clips.isNotEmpty) selectClip(0); });
            }

            Future<void> configureAudioSession() async {
              try {
                final session = await AudioSession.instance;
                await session.configure(const AudioSessionConfiguration(
                  avAudioSessionCategory: AVAudioSessionCategory.playback,
                  avAudioSessionCategoryOptions: AVAudioSessionCategoryOptions.mixWithOthers,
                  avAudioSessionMode: AVAudioSessionMode.defaultMode,
                  androidAudioAttributes: AndroidAudioAttributes(
                    contentType: AndroidAudioContentType.music,
                    usage: AndroidAudioUsage.media,
                  ),
                  androidWillPauseWhenDucked: false,
                ));
                await session.setActive(true);
              } catch (_) {}
            }

            void toast(String value) { if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(value))); }
            String time(double s) { final n = s.floor(); return '${(n ~/ 60).toString().padLeft(2,'0')}:${(n % 60).toString().padLeft(2,'0')}'; }
            double get aspect => cropRatio == '9:16' ? 9/16 : cropRatio == '16:9' ? 16/9 : cropRatio == '1:1' ? 1 : (projectCanvasAspect ?? 16/9);

            double curveSpeedAt(MediaClip item, double sourcePosition) {
              final length = (item.trimEnd - item.trimStart).clamp(.1, 999999).toDouble();
              final t = ((sourcePosition - item.trimStart) / length).clamp(0.0, 1.0);
              List<double> points;
              switch (item.curvePreset) {
                case 'Bullet': points = [1, .25, .25, 1]; break;
                case 'Jump Cut': points = [1, 4, 4, 1]; break;
                case 'Hero': points = [1, .5, .5, 1]; break;
                case 'Smooth': points = [1, 1.5, 1.5, 1]; break;
                case 'Flash In': points = [.25, 1, 2, 4]; break;
                default: points = [1, 3, .5, 1]; // Montage
              }
              final scaled = t * (points.length - 1);
              final index = scaled.floor().clamp(0, points.length - 2).toInt();
              final fraction = scaled - index;
              return (points[index] + (points[index + 1] - points[index]) * fraction).clamp(.1, 16).toDouble();
            }

            void stopSequence({bool refresh = true}) {
              playingSequence = false; sequenceToken++; sequenceTimer?.cancel(); sequenceTimer = null; player?.pause();
              for (final audio in audioPlayers.values) { audio.pause(); }
              for (final video in overlayPlayers.values) { video.pause(); }
              if (refresh && mounted) setState(() {});
            }

            Future<void> selectClip(int index) async {
              if (index < 0 || index >= clips.length) return;
              stopSequence(refresh: false);
              previewTransform.value = Matrix4.identity();
              final token = ++loadToken; final old = player; player = null;
              setState(() { selectedIndex = index; loading = true; selectedOverlay = -1; selectedAudio = -1; playhead = 0; });
              if (old != null) await old.dispose();
              if (!mounted || token != loadToken) return;
              final item = clips[index];
              if (!item.isVideo) {
                item.duration = item.duration <= 0 ? 3 : item.duration;
                try {
                  final codec = await ui.instantiateImageCodec(await File(item.path).readAsBytes());
                  final frame = await codec.getNextFrame();
                  originalImageAspect = frame.image.width / frame.image.height;
                  if (index == 0 && projectCanvasAspect == null) projectCanvasAspect = originalImageAspect;
                  frame.image.dispose();
                  codec.dispose();
                } catch (_) { originalImageAspect = 16 / 9; }
                if (mounted && token == loadToken) setState(() => loading = false);
                return;
              }
              try {
                final next = VideoPlayerController.file(File(item.path));
                await next.initialize();
                if (!mounted || token != loadToken) { await next.dispose(); return; }
                item.duration = next.value.duration.inMilliseconds / 1000;
                originalImageAspect = next.value.aspectRatio;
                if (index == 0 && projectCanvasAspect == null) projectCanvasAspect = originalImageAspect;
                if (item.trimEnd <= 0 || item.trimEnd > item.duration) item.trimEnd = item.duration;
                player = next;
                await next.setVolume(item.audioMuted ? 0 : item.audioVolume);
                await next.setPlaybackSpeed(item.speed);
                await next.setLooping(false);
                next.addListener(() { if (!mounted || !next.value.isInitialized) return; final pos = next.value.position.inMilliseconds / 1000; final relative = (pos - item.trimStart).clamp(0, item.duration).toDouble(); if ((relative - playhead).abs() > .12) setState(() => playhead = relative); });
                if (item.trimStart > 0) await next.seekTo(Duration(milliseconds: (item.trimStart * 1000).round()));
                setState(() => loading = false);
              } catch (e) { if (mounted && token == loadToken) { setState(() => loading = false); toast('Video preview not supported: $e'); } }
            }

            Future<void> playAll() async {
              if (clips.isEmpty) return;
              playingSequence = true;
              await playAt(selectedIndex.clamp(0, clips.length - 1).toInt());
              await syncTimelineLayers();
            }

            // Keep every audio/video layer locked to the same project clock.
            // This is deliberately synchronized from the playback timer, not just
            // started once when the user presses Play.
            Future<void> syncTimelineLayers() async {
              if (!playingSequence || _syncingTimelineLayers) return;
              _syncingTimelineLayers = true;
              final at = projectTime;
              try {
                for (final track in audioTracks) {
                  final audio = audioPlayers[track.id];
                  if (audio == null) continue;
                  final offset = at - track.start;
                  if (track.muted || offset < 0 || offset >= track.duration) {
                    if (audio.playing) await audio.pause();
                    continue;
                  }
                  final target = Duration(milliseconds: (offset * 1000).round());
                  final drift = (audio.position - target).inMilliseconds.abs();
                  if (drift > 280) await audio.seek(target);
                  await audio.setVolume(track.volume.clamp(0, 1).toDouble());
                  if (!audio.playing) audio.play().catchError((_) {});
                }

                for (final layer in overlays) {
                  if (!layer.isVideo || layer.kind != 'media') continue;
                  final controller = overlayPlayers[layer.id];
                  if (controller == null || !controller.value.isInitialized) continue;
                  final offset = at - layer.start;
                  if (offset < 0 || offset >= layer.duration) {
                    if (controller.value.isPlaying) await controller.pause();
                    continue;
                  }
                  final sourceDuration = controller.value.duration.inMilliseconds;
                  if (sourceDuration <= 0) continue;
                  final targetMs = (offset * 1000).round() % sourceDuration;
                  final drift = (controller.value.position.inMilliseconds - targetMs).abs();
                  if (drift > 280) {
                    await controller.seekTo(Duration(milliseconds: targetMs));
                  }
                  if (!controller.value.isPlaying) await controller.play();
                }
              } catch (_) {
                // A layer can be removed or disposed while the timeline is playing.
              } finally {
                _syncingTimelineLayers = false;
              }
            }

            KeyframePoint? keyframeValue(List<KeyframePoint> points, double at) {
              if (points.isEmpty) return null;
              final sorted = List<KeyframePoint>.of(points)..sort((a, b) => a.time.compareTo(b.time));
              if (at <= sorted.first.time) return sorted.first;
              if (at >= sorted.last.time) return sorted.last;
              for (var i = 0; i < sorted.length - 1; i++) {
                final a = sorted[i], b = sorted[i + 1];
                if (at >= a.time && at <= b.time) {
                  final span = (b.time - a.time).abs() < .0001 ? 1.0 : (at - a.time) / (b.time - a.time);
                  double mix(double x, double y) => x + (y - x) * span;
                  return KeyframePoint(time: at, scale: mix(a.scale, b.scale), x: mix(a.x, b.x), y: mix(a.y, b.y), opacity: mix(a.opacity, b.opacity), volume: mix(a.volume, b.volume));
                }
              }
              return sorted.last;
            }

            void applyKeyframes() {
              final at = projectTime;
              final item = current;
              if (item != null && item.keyframes.isNotEmpty) {
                final k = keyframeValue(item.keyframes, at)!;
                item.scale = k.scale.clamp(.1, 5).toDouble(); item.positionX = k.x.clamp(0, 1).toDouble(); item.positionY = k.y.clamp(0, 1).toDouble(); item.opacity = k.opacity.clamp(0, 1).toDouble(); item.audioVolume = k.volume.clamp(0, 1).toDouble();
                if (player?.value.isInitialized == true) player!.setVolume(item.audioMuted ? 0 : item.audioVolume);
              }
              for (final overlay in overlays) {
                if (overlay.keyframes.isEmpty) continue;
                final k = keyframeValue(overlay.keyframes, at)!;
                overlay.widthFactor = k.scale.clamp(.12, .9).toDouble(); overlay.centerX = k.x.clamp(0, 1).toDouble(); overlay.centerY = k.y.clamp(0, 1).toDouble(); overlay.opacity = k.opacity.clamp(0, 1).toDouble();
              }
              for (final track in audioTracks) {
                if (track.keyframes.isEmpty) continue;
                final k = keyframeValue(track.keyframes, at)!;
                final volume = track.muted ? 0.0 : k.volume.clamp(0, 1).toDouble();
                audioPlayers[track.id]?.setVolume(volume);
              }
            }

            void addKeyframe() {
              final audio = currentAudio;
              if (activeTool == 'Audio' && audio != null) {
                audio.keyframes.add(KeyframePoint(time: projectTime, volume: audio.volume));
                setState(() {}); toast('Audio keyframe added at ${time(projectTime)}.'); return;
              }
              final overlay = currentOverlay;
              if (activeTool == 'Overlay' && overlay != null) {
                overlay.keyframes.add(KeyframePoint(time: projectTime, scale: overlay.widthFactor, x: overlay.centerX, y: overlay.centerY, opacity: overlay.opacity));
                setState(() {}); toast('Overlay keyframe added at ${time(projectTime)}.'); return;
              }
              final item = current;
              if (item == null) { toast('Select a video, photo, overlay or audio clip first.'); return; }
              item.keyframes.add(KeyframePoint(time: projectTime, scale: item.scale, x: item.positionX, y: item.positionY, opacity: item.opacity, volume: item.audioVolume));
              setState(() {}); toast('Clip keyframe added at ${time(projectTime)}.');
            }

