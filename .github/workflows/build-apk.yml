            }
            Future<void> playAt(int index) async {
              if (!playingSequence || !mounted) return;
              sequenceTimer?.cancel(); final token = ++sequenceToken;
              if (index >= clips.length) { playingSequence = false; for (final a in audioPlayers.values) { a.pause(); } for (final v in overlayPlayers.values) { v.pause(); } if (mounted) setState(() {}); return; }
              final old = player; player = null; if (old != null) await old.dispose();
              if (!mounted || token != sequenceToken || !playingSequence) return;
              final item = clips[index]; setState(() { selectedIndex = index; loading = item.isVideo; playhead = 0; });
              if (!item.isVideo) {
                setState(() => loading = false);
                sequenceTimer = Timer.periodic(const Duration(milliseconds: 100), (timer) {
                  if (!mounted || token != sequenceToken || !playingSequence) { timer.cancel(); return; }
                  setState(() => playhead = (playhead + (.1 * item.speed)).clamp(0, item.duration).toDouble());
                  applyKeyframes();
                  syncTimelineLayers();
                  if (playhead >= item.duration) { timer.cancel(); playAt(index + 1); }
                });
                return;
              }
              try {
                final next = VideoPlayerController.file(File(item.path)); await next.initialize();
                if (!mounted || token != sequenceToken || !playingSequence) { await next.dispose(); return; }
                item.duration = next.value.duration.inMilliseconds / 1000; if (item.trimEnd <= 0 || item.trimEnd > item.duration) item.trimEnd = item.duration;
                player = next; await next.setVolume(item.audioMuted ? 0 : item.audioVolume); await next.seekTo(Duration(milliseconds: (item.trimStart * 1000).round())); await next.setPlaybackSpeed(item.speed); await next.play(); setState(() => loading = false);
                var appliedSpeed = item.speed;
                sequenceTimer = Timer.periodic(const Duration(milliseconds: 100), (timer) {
                  if (!mounted || token != sequenceToken || !playingSequence) { timer.cancel(); return; }
                  final p = player; if (p == null || !p.value.isInitialized) return;
                  final pos = p.value.position.inMilliseconds / 1000;
                  final relative = (pos - item.trimStart).clamp(0, item.duration).toDouble();
                  if (item.speedMode == 'Curve') {
                    final nextSpeed = curveSpeedAt(item, pos);
                    if ((nextSpeed - appliedSpeed).abs() >= .06) {
                      appliedSpeed = nextSpeed;
                      p.setPlaybackSpeed(nextSpeed);
                    }
                  }
                  if (mounted) setState(() => playhead = relative);
                  applyKeyframes();
                  syncTimelineLayers();
                  if (pos >= item.trimEnd) { timer.cancel(); playAt(index + 1); }
                });
              } catch (e) { toast('Could not play ${item.name}'); playAt(index + 1); }
            }

