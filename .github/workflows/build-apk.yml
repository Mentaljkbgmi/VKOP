name: Build VKOP Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project
        run: flutter create --org com.vkop --project-name ai --platforms android app

      - name: Set Android app name
        run: |
          sed -i 's/android:label="ai"/android:label="VKOP"/' app/android/app/src/main/AndroidManifest.xml

      - name: Install packages
        working-directory: app
        run: |
          flutter pub add file_picker
          flutter pub add video_player

      - name: Create VKOP Editor
        working-directory: app
        run: |
          cat > lib/main.dart <<'EOF'
          import 'dart:async';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:video_player/video_player.dart';

          void main() => runApp(const VKOPApp());

          class MediaClip {
            final Object id = Object();
            final String path;
            final String name;
            final bool isVideo;
            double duration = 0;
            double trimStart = 0;
            double trimEnd = 0;

            MediaClip({
              required this.path,
              required this.name,
              required this.isVideo,
            });
          }

          class VKOPApp extends StatelessWidget {
            const VKOPApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'VKOP',
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF101014),
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: Colors.deepPurple,
                    brightness: Brightness.dark,
                  ),
                  useMaterial3: true,
                ),
                home: const EditorPage(),
              );
            }
          }

          class EditorPage extends StatefulWidget {
            const EditorPage({super.key});

            @override
            State<EditorPage> createState() => _EditorPageState();
          }

          class _EditorPageState extends State<EditorPage> {
            final List<MediaClip> clips = [];
            VideoPlayerController? controller;
            int selectedIndex = -1;
            int loadToken = 0;
            int sequenceToken = 0;
            bool loading = false;
            bool sequencePlaying = false;
            Timer? sequenceTimer;
            String cropRatio = 'Original';

            MediaClip? get selectedClip =>
                selectedIndex >= 0 && selectedIndex < clips.length
                    ? clips[selectedIndex]
                    : null;

            double get cropAspectRatio {
              switch (cropRatio) {
                case '9:16':
                  return 9 / 16;
                case '16:9':
                  return 16 / 9;
                case '1:1':
                  return 1;
                default:
                  if (controller != null && controller!.value.isInitialized) {
                    return controller!.value.aspectRatio;
                  }
                  return 16 / 9;
              }
            }

            Future<void> pickMedia() async {
              try {
                final files = await FilePicker.pickFiles(type: FileType.media);
                if (files.isEmpty) return;

                final newItems = <MediaClip>[];
                for (final file in files) {
                  if (file.path == null) continue;
                  final ext = file.extension?.toLowerCase() ?? '';
                  const videoExt = {
                    'mp4', 'm4v', 'mov', '3gp', '3gpp', 'mkv', 'webm', 'avi',
                    'ts', 'mts', 'm2ts', 'mpg', 'mpeg', 'mpe', 'mpv', 'wmv',
                    'flv', 'ogv'
                  };
                  const imageExt = {
                    'jpg', 'jpeg', 'png', 'webp', 'gif', 'bmp', 'wbmp',
                    'heic', 'heif', 'avif', 'tif', 'tiff'
                  };
                  final isVideo = videoExt.contains(ext);
                  final isImage = imageExt.contains(ext);
                  if (!isVideo && !isImage) continue;

                  newItems.add(MediaClip(
                    path: file.path!,
                    name: file.name,
                    isVideo: isVideo,
                  ));
                }

                if (newItems.isEmpty) {
                  showMessage('No supported photo or video files were selected.');
                  return;
                }

                final firstNewIndex = clips.length;
                setState(() => clips.addAll(newItems));
                if (selectedIndex == -1) {
                  await selectClip(firstNewIndex);
                } else {
                  showMessage('${newItems.length} media file(s) added to timeline.');
                }
              } catch (e) {
                showMessage('Unable to add media: $e');
              }
            }

            void stopSequence({bool updateUi = true}) {
              sequencePlaying = false;
              sequenceToken++;
              sequenceTimer?.cancel();
              sequenceTimer = null;
              controller?.pause();
              if (updateUi && mounted) setState(() {});
            }

            Future<void> selectClip(int index) async {
              if (index < 0 || index >= clips.length) return;
              stopSequence(updateUi: false);
              final token = ++loadToken;
              final old = controller;
              controller = null;

              setState(() {
                selectedIndex = index;
                loading = true;
              });

              if (old != null) await old.dispose();
              if (!mounted || token != loadToken) return;

              final item = clips[index];
              if (!item.isVideo) {
                setState(() => loading = false);
                return;
              }

              try {
                final next = VideoPlayerController.file(File(item.path));
                await next.initialize();
                if (!mounted || token != loadToken) {
                  await next.dispose();
                  return;
                }
                item.duration = next.value.duration.inMilliseconds / 1000;
                if (item.trimEnd <= 0 || item.trimEnd > item.duration) {
                  item.trimEnd = item.duration;
                }
                controller = next;
                await next.setLooping(false);
                if (item.trimStart > 0) {
                  await next.seekTo(Duration(
                    milliseconds: (item.trimStart * 1000).round(),
                  ));
                }
                if (mounted && token == loadToken) {
                  setState(() => loading = false);
                }
              } catch (e) {
                if (mounted && token == loadToken) {
                  setState(() => loading = false);
                  showMessage('This video format cannot be previewed on this phone: $e');
                }
              }
            }

            Future<void> playSequence() async {
              if (clips.isEmpty) return;
              sequencePlaying = true;
              final start = selectedIndex >= 0 ? selectedIndex : 0;
              await playSequenceClip(start);
            }

            Future<void> playSequenceClip(int index) async {
              if (!sequencePlaying || !mounted) return;
              sequenceTimer?.cancel();
              sequenceTimer = null;
              final token = ++sequenceToken;

              if (index >= clips.length) {
                sequencePlaying = false;
                if (mounted) setState(() {});
                return;
              }

              final old = controller;
              controller = null;
              if (old != null) await old.dispose();
              if (!mounted || token != sequenceToken || !sequencePlaying) return;

              final item = clips[index];
              setState(() {
                selectedIndex = index;
                loading = item.isVideo;
              });

              if (!item.isVideo) {
                setState(() => loading = false);
                sequenceTimer = Timer(const Duration(seconds: 3), () {
                  if (sequencePlaying && token == sequenceToken) {
                    playSequenceClip(index + 1);
                  }
                });
                return;
              }

              try {
                final next = VideoPlayerController.file(File(item.path));
                await next.initialize();
                if (!mounted || token != sequenceToken || !sequencePlaying) {
                  await next.dispose();
                  return;
                }
                item.duration = next.value.duration.inMilliseconds / 1000;
                if (item.trimEnd <= 0 || item.trimEnd > item.duration) {
                  item.trimEnd = item.duration;
                }
                controller = next;
                await next.setLooping(false);
                await next.seekTo(Duration(
                  milliseconds: (item.trimStart * 1000).round(),
                ));
                await next.play();
                if (mounted && token == sequenceToken) {
                  setState(() => loading = false);
                }

                sequenceTimer = Timer.periodic(const Duration(milliseconds: 100), (timer) {
                  if (!mounted || token != sequenceToken || !sequencePlaying) {
                    timer.cancel();
                    return;
                  }
                  final current = controller;
                  if (current == null || !current.value.isInitialized) return;
                  final endMs = (item.trimEnd * 1000).round();
                  if (current.value.position.inMilliseconds >= endMs ||
                      (!current.value.isPlaying &&
                          current.value.position.inMilliseconds >= endMs - 150)) {
                    timer.cancel();
                    playSequenceClip(index + 1);
                  }
                });
              } catch (e) {
                if (mounted && token == sequenceToken) {
                  setState(() => loading = false);
                  showMessage('Could not play ${item.name}: $e');
                  playSequenceClip(index + 1);
                }
              }
            }

            void toggleSequence() {
              if (sequencePlaying) {
                stopSequence();
              } else {
                playSequence();
              }
            }

            void reorderClips(int oldIndex, int newIndex) {
              if (oldIndex < 0 || oldIndex >= clips.length) return;
              if (newIndex > oldIndex) newIndex--;
              if (newIndex < 0 || newIndex >= clips.length) return;
              if (sequencePlaying) stopSequence(updateUi: false);

              final selected = selectedClip;
              setState(() {
                final moved = clips.removeAt(oldIndex);
                clips.insert(newIndex, moved);
                selectedIndex = selected == null ? -1 : clips.indexOf(selected);
              });
            }

            Future<void> removeClip(int index) async {
              if (index < 0 || index >= clips.length) return;
              if (sequencePlaying) stopSequence(updateUi: false);
              final wasSelected = index == selectedIndex;
              final old = wasSelected ? controller : null;
              if (wasSelected) {
                controller = null;
                ++loadToken;
              }
              if (old != null) await old.dispose();

              int nextIndex = selectedIndex;
              setState(() {
                clips.removeAt(index);
                if (clips.isEmpty) {
                  selectedIndex = -1;
                } else if (wasSelected) {
                  selectedIndex = index >= clips.length ? clips.length - 1 : index;
                } else if (index < selectedIndex) {
                  selectedIndex--;
                }
                nextIndex = selectedIndex;
              });

              if (clips.isNotEmpty && (wasSelected || index < selectedIndex)) {
                await selectClip(nextIndex);
              }
            }

            void updateTrim(RangeValues values) {
              final item = selectedClip;
              if (item == null) return;
              setState(() {
                item.trimStart = values.start;
                item.trimEnd = values.end;
              });
            }

            void showMessage(String message) {
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(content: Text(message)),
              );
            }

            String formatTime(double seconds) {
              final total = seconds.floor();
              return '${(total ~/ 60).toString().padLeft(2, '0')}:'
                  '${(total % 60).toString().padLeft(2, '0')}';
            }

            @override
            void dispose() {
              sequenceTimer?.cancel();
              controller?.dispose();
              super.dispose();
            }

            Widget buildPreview(MediaClip? item) {
              if (loading) return const CircularProgressIndicator();
              if (item == null) {
                return const Column(
                  mainAxisAlignment: MainAxisAlignment.center,
                  children: [
                    Icon(Icons.perm_media_outlined, size: 55, color: Colors.white38),
                    SizedBox(height: 10),
                    Text('Select photos or videos to start'),
                  ],
                );
              }
              if (!item.isVideo) {
                return ClipRRect(
                  borderRadius: BorderRadius.circular(8),
                  child: Image.file(
                    File(item.path),
                    fit: BoxFit.contain,
                    errorBuilder: (_, __, ___) => const Text(
                      'This image format cannot be previewed on this device.',
                      textAlign: TextAlign.center,
                    ),
                  ),
                );
              }
              if (controller == null || !controller!.value.isInitialized) {
                return const Text('Video preview unavailable');
              }
              return ClipRect(
                child: AspectRatio(
                  aspectRatio: cropAspectRatio,
                  child: FittedBox(
                    fit: BoxFit.cover,
                    child: SizedBox(
                      width: controller!.value.size.width,
                      height: controller!.value.size.height,
                      child: VideoPlayer(controller!),
                    ),
                  ),
                ),
              );
            }

            Widget buildTimeline() {
              if (clips.isEmpty) {
                return Container(
                  width: double.infinity,
                  padding: const EdgeInsets.all(25),
                  decoration: BoxDecoration(
                    color: const Color(0xFF1C1C24),
                    borderRadius: BorderRadius.circular(12),
                  ),
                  child: const Text(
                    'Tap + to add photos, videos or GIFs',
                    textAlign: TextAlign.center,
                    style: TextStyle(color: Colors.white54),
                  ),
                );
              }

              return SizedBox(
                height: 116,
                child: ReorderableListView.builder(
                  scrollDirection: Axis.horizontal,
                  buildDefaultDragHandles: false,
                  itemCount: clips.length,
                  onReorder: reorderClips,
                  itemBuilder: (context, index) {
                    final media = clips[index];
                    final active = index == selectedIndex;
                    return ReorderableDelayedDragStartListener(
                      key: ValueKey(media.id),
                      index: index,
                      child: GestureDetector(
                        onTap: () => selectClip(index),
                        child: Container(
                          width: 155,
                          margin: const EdgeInsets.only(right: 10),
                          padding: const EdgeInsets.all(9),
                          decoration: BoxDecoration(
                            color: active
                                ? Colors.deepPurple.withOpacity(0.35)
                                : const Color(0xFF24242D),
                            borderRadius: BorderRadius.circular(12),
                            border: Border.all(
                              color: active ? Colors.deepPurpleAccent : Colors.white12,
                              width: active ? 2 : 1,
                            ),
                          ),
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Row(children: [
                                Icon(
                                  media.isVideo ? Icons.video_file : Icons.image,
                                  size: 18,
                                ),
                                const SizedBox(width: 5),
                                const Expanded(
                                  child: Text('HOLD & DRAG',
                                    maxLines: 1,
                                    overflow: TextOverflow.ellipsis,
                                    style: TextStyle(fontSize: 8, color: Colors.white54)),
                                ),
                                GestureDetector(
                                  onTap: () => removeClip(index),
                                  child: const Icon(Icons.close,
                                    color: Colors.redAccent, size: 20),
                                ),
                              ]),
                              const Spacer(),
                              Text(
                                media.name,
                                maxLines: 2,
                                overflow: TextOverflow.ellipsis,
                                style: const TextStyle(fontSize: 12),
                              ),
                              const SizedBox(height: 3),
                              Text(
                                media.isVideo
                                    ? (media.duration > 0
                                        ? formatTime(media.duration)
                                        : 'Video')
                                    : (media.name.toLowerCase().endsWith('.gif')
                                        ? 'GIF'
                                        : 'Photo'),
                                style: const TextStyle(
                                  fontSize: 10,
                                  color: Colors.white54,
                                ),
                              ),
                            ],
                          ),
                        ),
                      ),
                    );
                  },
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final item = selectedClip;
              return Scaffold(
                appBar: AppBar(
                  title: const Text(
                    'VKOP EDITOR',
                    style: TextStyle(fontWeight: FontWeight.bold, letterSpacing: 2),
                  ),
                  actions: [
                    IconButton(
                      onPressed: pickMedia,
                      icon: const Icon(Icons.add_circle_outline),
                      tooltip: 'Add photos, videos and GIFs',
                    ),
                  ],
                ),
                body: SafeArea(
                  child: Column(
                    children: [
                      Expanded(
                        child: SingleChildScrollView(
                          padding: const EdgeInsets.all(14),
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              const Text('PREVIEW', style: TextStyle(
                                fontWeight: FontWeight.bold, letterSpacing: 1.5)),
                              const SizedBox(height: 12),
                              Container(
                                width: double.infinity,
                                height: 300,
                                padding: const EdgeInsets.all(8),
                                decoration: BoxDecoration(
                                  color: Colors.black,
                                  borderRadius: BorderRadius.circular(14),
                                  border: Border.all(color: Colors.white12),
                                ),
                                child: Center(child: buildPreview(item)),
                              ),
                              const SizedBox(height: 10),
                              Center(
                                child: Column(
                                  children: [
                                    IconButton.filled(
                                      onPressed: clips.isEmpty ? null : toggleSequence,
                                      iconSize: 32,
                                      icon: Icon(sequencePlaying
                                          ? Icons.pause
                                          : Icons.play_arrow),
                                    ),
                                    const Text('PLAY FULL TIMELINE',
                                      style: TextStyle(fontSize: 10, color: Colors.white54)),
                                  ],
                                ),
                              ),
                              const SizedBox(height: 18),
                              Row(
                                mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                children: [
                                  const Text('TIMELINE', style: TextStyle(
                                    fontWeight: FontWeight.bold, letterSpacing: 1.5)),
                                  Text('${clips.length} items',
                                    style: const TextStyle(color: Colors.white54)),
                                ],
                              ),
                              const SizedBox(height: 10),
                              buildTimeline(),
                              const SizedBox(height: 22),
                              const Text('TRIM SELECTED VIDEO', style: TextStyle(
                                fontWeight: FontWeight.bold, letterSpacing: 1.2)),
                              const SizedBox(height: 8),
                              if (item != null && item.isVideo && item.duration > 0)
                                Column(children: [
                                  RangeSlider(
                                    min: 0,
                                    max: item.duration,
                                    values: RangeValues(
                                      item.trimStart.clamp(0, item.duration).toDouble(),
                                      item.trimEnd.clamp(0, item.duration).toDouble(),
                                    ),
                                    onChanged: (v) {
                                      if (v.end - v.start >= 0.1) updateTrim(v);
                                    },
                                  ),
                                  Row(
                                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                    children: [
                                      Text('IN: ${formatTime(item.trimStart)}'),
                                      Text('OUT: ${formatTime(item.trimEnd)}'),
                                    ],
                                  ),
                                ])
                              else
                                const Text('Select a video to adjust trim points.',
                                  style: TextStyle(color: Colors.white54)),
                              const SizedBox(height: 22),
                              const Text('CROP RATIO', style: TextStyle(
                                fontWeight: FontWeight.bold, letterSpacing: 1.2)),
                              const SizedBox(height: 10),
                              Wrap(
                                spacing: 8,
                                children: ['Original', '9:16', '16:9', '1:1'].map((ratio) {
                                  return ChoiceChip(
                                    label: Text(ratio),
                                    selected: cropRatio == ratio,
                                    onSelected: (_) => setState(() => cropRatio = ratio),
                                  );
                                }).toList(),
                              ),
                              const SizedBox(height: 20),
                              Container(
                                width: double.infinity,
                                padding: const EdgeInsets.all(12),
                                decoration: BoxDecoration(
                                  color: const Color(0xFF20202A),
                                  borderRadius: BorderRadius.circular(12),
                                ),
                                child: const Text(
                                  'Drag and hold timeline clips to change their order. '
                                  'Play Full Timeline previews each photo/GIF for 3 seconds '
                                  'and plays videos using the selected trim range. '
                                  'Final video export is the next development step.',
                                  style: TextStyle(fontSize: 12, color: Colors.white60),
                                ),
                              ),
                            ],
                          ),
                        ),
                      ),
                      Container(
                        padding: const EdgeInsets.all(12),
                        decoration: const BoxDecoration(
                          color: Color(0xFF1A1A22),
                          border: Border(top: BorderSide(color: Colors.white12)),
                        ),
                        child: SizedBox(
                          width: double.infinity,
                          child: OutlinedButton.icon(
                            onPressed: pickMedia,
                            icon: const Icon(Icons.add),
                            label: const Text('Add Photos / Videos / GIFs'),
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VKOP-Android-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
