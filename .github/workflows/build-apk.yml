            double get totalTimelineDuration => clips.fold<double>(0, (sum, c) => sum + ((c.isVideo && c.trimEnd > c.trimStart ? c.trimEnd - c.trimStart : c.duration) / c.speed.clamp(.1, 16)));
            double get timelinePixelsPerSecond => 55;
            double get timelineContentWidth => (totalTimelineDuration * timelinePixelsPerSecond).clamp(500.0, 12000.0).toDouble();

            Future<void> seekTimeline(double seconds) async {
              if (clips.isEmpty) return;
              final target = seconds.clamp(0.0, totalTimelineDuration).toDouble();
              var offset = 0.0;
              var index = clips.length - 1;
              var local = 0.0;
              for (var i = 0; i < clips.length; i++) {
                final clip = clips[i];
                final sourceLength = clip.isVideo && clip.trimEnd > clip.trimStart
                    ? clip.trimEnd - clip.trimStart : clip.duration;
                final timelineLength = sourceLength / clip.speed.clamp(.1, 16);
                if (target <= offset + timelineLength || i == clips.length - 1) {
                  index = i;
                  local = (target - offset).clamp(0.0, timelineLength).toDouble();
                  break;
                }
                offset += timelineLength;
              }
              await selectClip(index);
              if (!mounted) return;
              final clip = current;
              if (clip == null) return;
              final sourcePosition = local * clip.speed.clamp(.1, 16);
              if (clip.isVideo && player?.value.isInitialized == true) {
                await player!.seekTo(Duration(milliseconds: ((clip.trimStart + sourcePosition) * 1000).round()));
              }
              if (mounted) setState(() => playhead = sourcePosition);
            }

