                  case 'Documentary': selectedTextFont = 'Roboto Light'; textColorName = 'White'; textSize = 30; textBold = false; textAnimationPreset = 'Fade In'; break;
                  default: selectedTextFont = 'Roboto'; textColorName = 'White'; textSize = 30; textBold = true; textAnimationPreset = 'None';
                }
              });
            }

            Color get selectedTextColor => switch (textColorName) {
              'Black' => Colors.black,
              'Yellow' => Colors.yellow,
              'Purple' => const Color(0xFFB99AFF),
              'Red' => Colors.redAccent,
              _ => Colors.white,
            };

            void reorder(int oldIndex, int newIndex) {
              if (newIndex > oldIndex) newIndex--; if (newIndex < 0 || newIndex >= clips.length) return;
              stopSequence(refresh: false); final selectedItem = current;
              setState(() { final moved = clips.removeAt(oldIndex); clips.insert(newIndex, moved); selectedIndex = selectedItem == null ? 0 : clips.indexOf(selectedItem); });
            }

            Future<void> removeSelected() async {
              if (current == null) return; final old = player; player = null; ++loadToken; stopSequence(refresh: false);
              setState(() { clips.removeAt(selectedIndex); selectedIndex = clips.isEmpty ? -1 : (selectedIndex >= clips.length ? clips.length - 1 : selectedIndex); });
              if (old != null) await old.dispose(); if (clips.isNotEmpty) await selectClip(selectedIndex);
            }

            Future<void> splitSelected() async {
              final item = current; final p = player;
              if (item == null || !item.isVideo || p == null || !p.value.isInitialized) { toast('Select a video and play it to the split point first.'); return; }
              final cut = p.value.position.inMilliseconds / 1000;
              if (cut <= item.trimStart + .1 || cut >= item.trimEnd - .1) { toast('Move the playhead inside the selected video range first.'); return; }
              final second = MediaClip(path: item.path, name: '${item.name} (split)', isVideo: true, duration: item.duration)..trimStart = cut..trimEnd = item.trimEnd;
              setState(() { item.trimEnd = cut; clips.insert(selectedIndex + 1, second); }); toast('Clip split into two timeline segments.');
            }

            Future<void> extractAudio() async {
              final item = current;
              if (item == null || !item.isVideo) {
                toast('Select a video clip first to extract its audio.');
                return;
              }
              if (extractingAudio) return;
              setState(() => extractingAudio = true);
              String? outputPath;
              try {
                final directory = await getTemporaryDirectory();
                final stamp = DateTime.now().millisecondsSinceEpoch;
                outputPath = '${directory.path}/VKOP_audio_$stamp.m4a';
                final args = <String>[
                  '-y',
                  '-ss', item.trimStart.toStringAsFixed(3),
                  '-i', item.path,
                  '-t', (item.trimEnd > item.trimStart ? item.trimEnd - item.trimStart : item.duration).toStringAsFixed(3),
                  '-vn', '-c:a', 'aac', '-b:a', '192k',
                  '-movflags', '+faststart',
                  outputPath,
                ];
                await ffmpegChannel.invokeMethod<String>('execute', {'arguments': args, 'reportProgress': true});
                final output = File(outputPath);
                if (!await output.exists() || await output.length() < 1024) {
                  throw Exception('Audio extraction did not create a valid file.');
                }
                await ffmpegChannel.invokeMethod<String>('saveAudioToDownloads', {
                  'sourcePath': outputPath,
                  'fileName': 'VKOP_Audio_$stamp.m4a',
                });
                toast('Audio extracted and saved to Music/VKOP.');
              } catch (e) {
                toast('Audio extraction failed: $e');
              } finally {
                if (outputPath != null) {
                  try { await File(outputPath).delete(); } catch (_) {}
                }
                if (mounted) setState(() => extractingAudio = false);
              }
            }

