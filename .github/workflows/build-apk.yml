            Future<void> ensureClipDurations() async {
              for (final c in clips) {
                if (!c.isVideo || c.duration > 0 && c.trimEnd > 0) continue;
                final controller = VideoPlayerController.file(File(c.path));
                try { await controller.initialize(); c.duration = controller.value.duration.inMilliseconds / 1000; c.trimEnd = c.duration; }
                finally { await controller.dispose(); }
              }
            }

            String keyframeVolumeExpression(List<KeyframePoint> points, double timelineOffset) {
              if (points.isEmpty) return '1';
              final sorted = List<KeyframePoint>.of(points)..sort((a, b) => a.time.compareTo(b.time));
              String expression = sorted.last.volume.clamp(0, 2).toStringAsFixed(4);
              for (var i = sorted.length - 2; i >= 0; i--) {
                final a = sorted[i], b = sorted[i + 1];
                final start = (a.time - timelineOffset).toStringAsFixed(4);
                final end = (b.time - timelineOffset).toStringAsFixed(4);
                final first = a.volume.clamp(0, 2).toStringAsFixed(4);
                final delta = (b.volume - a.volume).toStringAsFixed(4);
                final span = (b.time - a.time).abs() < .0001 ? '0.0001' : (b.time - a.time).toStringAsFixed(4);
                expression = 'if(lt(t\\,$end)\\,$first+($delta)*(t-$start)/$span\\,$expression)';
              }
              final firstTime = (sorted.first.time - timelineOffset).toStringAsFixed(4);
              final firstValue = sorted.first.volume.clamp(0, 2).toStringAsFixed(4);
              return 'if(lt(t\\,$firstTime)\\,$firstValue\\,$expression)';
            }

            String keyframeExpression(List<KeyframePoint> points, String property, double timelineOffset, double fallback, {String timeVariable = 't'}) {
              if (points.isEmpty) return fallback.toStringAsFixed(4);
              double value(KeyframePoint point) => switch (property) {
                'scale' => point.scale,
                'x' => point.x,
                'y' => point.y,
                'opacity' => point.opacity,
                _ => point.volume,
              };
              final sorted = List<KeyframePoint>.of(points)..sort((a, b) => a.time.compareTo(b.time));
              String expression = value(sorted.last).toStringAsFixed(4);
              for (var i = sorted.length - 2; i >= 0; i--) {
                final a = sorted[i], b = sorted[i + 1];
                final start = (a.time - timelineOffset).toStringAsFixed(4);
                final end = (b.time - timelineOffset).toStringAsFixed(4);
                final first = value(a).toStringAsFixed(4);
                final delta = (value(b) - value(a)).toStringAsFixed(4);
                final span = (b.time - a.time).abs() < .0001 ? '0.0001' : (b.time - a.time).toStringAsFixed(4);
                expression = 'if(lt(' + timeVariable + '\\,' + end + ')\\,' + first + '+(' + delta + ')*(' + timeVariable + '-' + start + ')/' + span + '\\,' + expression + ')';
              }
              final firstTime = (sorted.first.time - timelineOffset).toStringAsFixed(4);
              final firstValue = value(sorted.first).toStringAsFixed(4);
              return 'if(lt(' + timeVariable + '\\,' + firstTime + ')\\,' + firstValue + '\\,' + expression + ')';
            }

            String escapeFfmpegText(String value) {
              return value
                  .replaceAll('\\', '\\\\')
                  .replaceAll(':', '\\:')
                  .replaceAll("'", "\\'")
                  .replaceAll('%', '\\%')
                  .replaceAll(',', '\\,')
                  .replaceAll('[', '\\[')
                  .replaceAll(']', '\\]');
            }

            Future<String> renderOverlayPng(OverlayClip layer) async {
              final recorder = ui.PictureRecorder();
              final canvas = ui.Canvas(recorder);
              final isEmoji = layer.kind == 'emoji';
              final style = TextStyle(
                fontSize: isEmoji ? 360 : (layer.textSize * 2).clamp(24, 180).toDouble(),
                color: layer.textColor,
                fontWeight: layer.textBold ? FontWeight.bold : FontWeight.normal,
                shadows: isEmoji ? const [] : const [Shadow(color: Colors.black87, blurRadius: 5, offset: Offset(2, 2))],
              );
              final painter = TextPainter(text: TextSpan(text: layer.content, style: style), textDirection: TextDirection.ltr, textAlign: TextAlign.center);
              painter.layout(maxWidth: 480);
              painter.paint(canvas, Offset((512 - painter.width) / 2, (512 - painter.height) / 2));
              final picture = recorder.endRecording();
              final image = await picture.toImage(512, 512);
              final data = await image.toByteData(format: ui.ImageByteFormat.png);
              if (data == null) throw StateError('Could not render overlay layer.');
              final dir = await getTemporaryDirectory();
              final file = File('${dir.path}/vkop_overlay_${DateTime.now().microsecondsSinceEpoch}.png');
              await file.writeAsBytes(data.buffer.asUint8List(), flush: true);
              image.dispose();
              picture.dispose();
              return file.path;
            }

            Future<void> exportProject() async {
              if (exporting) return;
              if (clips.isEmpty) { toast('Add a main video or photo first.'); return; }
              setState(() { exporting = true; exportProgress = 0; });
              final temporaryAudioFiles = <File>[];
              try {
                await ensureClipDurations();
                final size = exportResolution == '720p' ? 720 : exportResolution == '1080p' ? 1080 : exportResolution == '2K' ? 1440 : 2160;
                final projectAspect = aspect;
                final rawWidth = projectAspect >= 1 ? size * projectAspect : size;
                final rawHeight = projectAspect < 1 ? size / projectAspect : size;
                final width = rawWidth.round().isEven ? rawWidth.round() : rawWidth.round() + 1;
                final height = rawHeight.round().isEven ? rawHeight.round() : rawHeight.round() + 1;
                final args = <String>['-y'];
                final durations = <double>[];
                final clipSpeeds = <double>[];
                final clipCurveSegments = <List<Map<String, double>>>[];
                for (final c in clips) {
                  final sourceDuration = c.isVideo
                      ? (c.trimEnd - c.trimStart).clamp(.1, 86400).toDouble()
                      : c.duration.clamp(.1, 86400).toDouble();
                  final clipSpeed = c.speed.clamp(.1, 16).toDouble();
                  final segments = <Map<String, double>>[];
                  if (c.isVideo && c.speedMode == 'Curve') {
                    final segmentCount = (sourceDuration * exportFps / 4).floor().clamp(1, 24).toInt();
                    final sourceStep = sourceDuration / segmentCount;
                    var outputDuration = 0.0;
                    for (var segment = 0; segment < segmentCount; segment++) {
                      final sourceOffset = segment * sourceStep;
                      final sourcePart = segment == segmentCount - 1 ? sourceDuration - sourceOffset : sourceStep;
                      final segmentSpeed = curveSpeedAt(c, c.trimStart + sourceOffset + sourcePart / 2);
                      final renderedPart = sourcePart / segmentSpeed;
                      segments.add({'offset': sourceOffset, 'source': sourcePart, 'speed': segmentSpeed, 'output': renderedPart});
                      outputDuration += renderedPart;
                    }
                    clipSpeeds.add(sourceDuration / outputDuration);
                    durations.add(outputDuration);
                  } else {
                    clipSpeeds.add(clipSpeed);
                    durations.add(sourceDuration / clipSpeed);
                  }
                  clipCurveSegments.add(segments);
                  if (c.isVideo) {
                    args.addAll(['-ss', c.trimStart.toStringAsFixed(3), '-i', c.path]);
                  } else {
                    args.addAll(['-loop', '1', '-t', sourceDuration.toStringAsFixed(3), '-i', c.path]);
                  }
                }
                final exportOverlays = <OverlayClip>[];
                for (final layer in overlays) {
                  if (layer.kind == 'emoji' || layer.kind == 'text') {
                    final overlayPng = await renderOverlayPng(layer);
                    temporaryAudioFiles.add(File(overlayPng));
                    exportOverlays.add(OverlayClip(path: overlayPng, name: layer.name, isVideo: false)
                      ..start = layer.start ..duration = layer.duration ..widthFactor = layer.widthFactor
                      ..centerX = layer.centerX ..centerY = layer.centerY ..rotation = layer.rotation
                      ..opacity = layer.opacity ..keyframes.addAll(layer.keyframes));
                  } else {
                    exportOverlays.add(layer);
                  }
                }
                for (final o in exportOverlays) {
                  if (o.isVideo || o.path.toLowerCase().endsWith('.gif')) {
                    args.addAll(['-stream_loop', '-1', '-i', o.path]);
                  } else {
                    args.addAll(['-loop', '1', '-i', o.path]);
                  }
                }

                final projectDuration = durations.fold<double>(0, (a, b) => a + b);
                exportTotalDuration = projectDuration.clamp(.1, 86400).toDouble();
                final documents = await getApplicationDocumentsDirectory();
                final audioInputs = <Map<String, Object>>[];

                // Extract each main video's original audio separately so silent clips do not break the export graph.
                var timelineStart = 0.0;
                for (var i = 0; i < clips.length; i++) {
                  final c = clips[i];
                  if (c.isVideo && !c.audioMuted && c.audioVolume > 0) {
                    final audioPath = documents.path + '/vkop_source_audio_' + DateTime.now().microsecondsSinceEpoch.toString() + '_' + i.toString() + '.m4a';
                    try {
                      await ffmpegChannel.invokeMethod<String>('execute', {'arguments': [
                        '-y', '-ss', c.trimStart.toStringAsFixed(3), '-t',
                        (durations[i] * clipSpeeds[i]).toStringAsFixed(3), '-i', c.path,
                        '-vn', '-ac', '2', '-ar', '48000', '-c:a', 'aac', audioPath
                      ]});
                      final extracted = File(audioPath);
                      if (await extracted.exists() && await extracted.length() > 1024) {
                        temporaryAudioFiles.add(extracted);
                        args.addAll(['-i', audioPath]);
                        audioInputs.add({'path': audioPath, 'start': timelineStart, 'duration': durations[i], 'volume': c.audioVolume, 'speed': clipSpeeds[i], 'voice': true, 'keyframes': c.keyframes, 'curveSegments': clipCurveSegments[i]});
                      }
                    } catch (_) {
                      // A video without an audio stream is valid; continue without its original sound.
                    }
                  }
                  timelineStart += durations[i];
                }

                // Add user-selected music and sound-effect tracks after the extracted source audio inputs.
                for (final track in audioTracks) {
                  if (!track.muted && track.volume > 0 && track.start < projectDuration) {
                    args.addAll(['-stream_loop', '-1', '-i', track.path]);
                    audioInputs.add({'path': track.path, 'start': track.start, 'duration': projectDuration - track.start, 'volume': track.volume, 'speed': 1.0, 'voice': false, 'keyframes': track.keyframes});
                  }
                }

                final filters = <String>[];
                var clipTimelineOffset = 0.0;
                for (var i = 0; i < clips.length; i++) {
                  final c = clips[i];
                  final segments = clipCurveSegments[i];
                  final clipKeys = c.keyframes;
                  final scaleExpr = keyframeExpression(clipKeys, 'scale', clipTimelineOffset, c.scale);
                  final xExpr = keyframeExpression(clipKeys, 'x', clipTimelineOffset, c.positionX);
                  final yExpr = keyframeExpression(clipKeys, 'y', clipTimelineOffset, c.positionY);
                  final opacityExpr = keyframeExpression(clipKeys, 'opacity', clipTimelineOffset, c.opacity);
                  final clipAlpha = clipKeys.isEmpty
                    ? (c.opacity < .999 ? ',colorchannelmixer=aa=' + c.opacity.clamp(0, 1).toStringAsFixed(4) : '')
                    : ",geq=r='r(X,Y)':g='g(X,Y)':b='b(X,Y)':a='alpha(X,Y)*(" +
                      keyframeExpression(clipKeys, 'opacity', clipTimelineOffset, c.opacity, timeVariable: 'T') + ")'";
                  final transform = clipKeys.isEmpty && (c.scale - 1).abs() < .001 && (c.positionX - .5).abs() < .001 && (c.positionY - .5).abs() < .001 ? '' :
                    ",scale=w='ceil(" + width.toString() + "*max(0.1," + scaleExpr + ")/2)*2':h='ceil(" + height.toString() + "*max(0.1," + scaleExpr + ")/2)*2':eval=frame" +
                    ",pad=w='max(iw," + width.toString() + ")':h='max(ih," + height.toString() + ")':x='(ow-iw)*" + xExpr + "':y='(oh-ih)*" + yExpr + "':color=black@0:eval=frame" +
                    ",crop=" + width.toString() + ":" + height.toString() + ":x='(iw-ow)*" + xExpr + "':y='(ih-oh)*" + yExpr + "'";
                  String videoTail = ',scale=' + width.toString() + ':' + height.toString() +
                    ':force_original_aspect_ratio=decrease,format=rgba,pad=' + width.toString() + ':' + height.toString() +
                    ':(ow-iw)/2:(oh-ih)/2:color=black@0,setsar=1,fps=' + exportFps.toString() + ',format=rgba';
                  final rotationFilter = c.rotation.abs() > .001
                    ? ',format=rgba,rotate=' + c.rotation.toStringAsFixed(4) + ':c=black@0:ow=rotw(iw):oh=roth(ih)'
                    : '';
                  if (segments.isNotEmpty) {
                    final labels = <String>[];
                    var segmentTimelineOffset = clipTimelineOffset;
                    for (var k = 0; k < segments.length; k++) {
                      final segment = segments[k];
                      final label = 'curve_' + i.toString() + '_' + k.toString();
                      final segmentAlpha = clipKeys.isEmpty
                        ? (c.opacity < .999 ? ',colorchannelmixer=aa=' + c.opacity.clamp(0, 1).toStringAsFixed(4) : '')
                        : ",geq=r='r(X,Y)':g='g(X,Y)':b='b(X,Y)':a='alpha(X,Y)*(" +
                          keyframeExpression(clipKeys, 'opacity', segmentTimelineOffset, c.opacity, timeVariable: 'T') + ")'";
                      final segmentTransform = clipKeys.isEmpty && (c.scale - 1).abs() < .001 && (c.positionX - .5).abs() < .001 && (c.positionY - .5).abs() < .001 ? '' :
                        ",scale=w='ceil(" + width.toString() + "*max(0.1," +
                        keyframeExpression(clipKeys, 'scale', segmentTimelineOffset, c.scale) +
                        ")/2)*2':h='ceil(" + height.toString() + "*max(0.1," +
                        keyframeExpression(clipKeys, 'scale', segmentTimelineOffset, c.scale) +
                        ")/2)*2':eval=frame" +
                        ",pad=w='max(iw," + width.toString() + ")':h='max(ih," + height.toString() +
                        ")':x='(ow-iw)*" + keyframeExpression(clipKeys, 'x', segmentTimelineOffset, c.positionX) +
                        "':y='(oh-ih)*" + keyframeExpression(clipKeys, 'y', segmentTimelineOffset, c.positionY) +
                        "':color=black@0:eval=frame,crop=" + width.toString() + ":" + height.toString() +
                        ":x='(iw-ow)*" + keyframeExpression(clipKeys, 'x', segmentTimelineOffset, c.positionX) +
                        "':y='(ih-oh)*" + keyframeExpression(clipKeys, 'y', segmentTimelineOffset, c.positionY) + "'";
                      filters.add('[' + i.toString() + ':v]trim=start=' + segment['offset']!.toStringAsFixed(4) +
                        ':duration=' + segment['source']!.toStringAsFixed(4) +
                        ',setpts=(PTS-STARTPTS)/' + segment['speed']!.toStringAsFixed(4) + rotationFilter +
                        videoTail + segmentTransform + segmentAlpha + '[' + label + ']');
                      labels.add('[' + label + ']');
                      segmentTimelineOffset += segment['output']!;
                    }
                    filters.add(labels.join() + 'concat=n=' + segments.length.toString() + ':v=1:a=0[v' + i.toString() + ']');
                  } else {
                    final sourceDuration = durations[i] * clipSpeeds[i];
                    filters.add('[' + i.toString() + ':v]trim=duration=' + sourceDuration.toStringAsFixed(3) +
                      ',setpts=(PTS-STARTPTS)/' + clipSpeeds[i].toStringAsFixed(4) + rotationFilter +
                      videoTail + transform + clipAlpha + '[v' + i.toString() + ']');
                  }
                  clipTimelineOffset += durations[i];
                }
                final baseInputs = List.generate(clips.length, (i) => '[v' + i.toString() + ']').join();
                filters.add(baseInputs + 'concat=n=' + clips.length.toString() + ':v=1:a=0[base0]');
                final canvasColor = switch (backgroundColorName) {
                  'White' => 'white',
                  'Grey' => '0x777777',
                  'Purple' => '0x7653D6',
                  'Green' => '0x16865B',
                  _ => 'black',
                };
                filters.add('color=c=' + canvasColor + ':s=' + width.toString() + 'x' + height.toString() +
                  ':r=' + exportFps.toString() + ':d=' + projectDuration.toStringAsFixed(3) + '[vkop_canvas]');
                filters.add('[vkop_canvas][base0]overlay=shortest=1:format=auto[base_composited]');
                filters.add('[base_composited]split=2[vkop_original][vkop_grade_source]');
                var previous = 'vkop_grade_source';

                // CapCut-style basic grading and tone controls.
                final basicLabel = 'vkop_basic_grade';
                final eqBrightness = (brightness + exposure * 0.5 + brilliance * 0.002).clamp(-1.0, 1.0);
                final eqContrast = (contrast + (highlights.abs() + shadows.abs()) * 0.0005).clamp(0.0, 3.0);
                final eqSaturation = (filter == 'B&W' ? 0.0 : saturation).clamp(0.0, 3.0);
                filters.add('[' + previous + ']eq=brightness=' + eqBrightness.toStringAsFixed(4) +
                  ':contrast=' + eqContrast.toStringAsFixed(4) + ':saturation=' + eqSaturation.toStringAsFixed(4) +
                  ':gamma=' + (1.0 - brilliance * 0.002).clamp(0.5, 1.5).toStringAsFixed(4) + '[' + basicLabel + ']');
                previous = basicLabel;
                if (temperature.abs() > .1 || tint.abs() > .1 || shadowWheelR.abs() + shadowWheelG.abs() + shadowWheelB.abs() +
                    midWheelR.abs() + midWheelG.abs() + midWheelB.abs() + highWheelR.abs() + highWheelG.abs() + highWheelB.abs() > .1) {
                  final wheel = 'vkop_color_balance';
                  final rs = (temperature * .0008 + shadowWheelR * .001 + midWheelR * .0007 + highWheelR * .001).clamp(-.5, .5);
                  final gs = (tint * .0008 + shadowWheelG * .001 + midWheelG * .0007 + highWheelG * .001).clamp(-.5, .5);
                  final bs = (-temperature * .0008 + shadowWheelB * .001 + midWheelB * .0007 + highWheelB * .001).clamp(-.5, .5);
                  filters.add('[' + previous + ']colorbalance=rs=' + rs.toStringAsFixed(4) + ':gs=' + gs.toStringAsFixed(4) +
                    ':bs=' + bs.toStringAsFixed(4) + ':rm=' + (midWheelR * .001).toStringAsFixed(4) +
                    ':gm=' + (midWheelG * .001).toStringAsFixed(4) + ':bm=' + (midWheelB * .001).toStringAsFixed(4) +
                    ':rh=' + (highWheelR * .001).toStringAsFixed(4) + ':gh=' + (highWheelG * .001).toStringAsFixed(4) +
                    ':bh=' + (highWheelB * .001).toStringAsFixed(4) + ':pl=1[' + wheel + ']');
                  previous = wheel;
                }
                if (highlights.abs() + shadows.abs() + whites.abs() + blacks.abs() > .1) {
                  final tone = 'vkop_tone';
                  final blackPoint = (blacks * -0.0015).clamp(-.15, .15);
                  final whitePoint = (1.0 - whites * .0015).clamp(.75, 1.0);
                  filters.add('[' + previous + ']colorlevels=romin=' + blackPoint.toStringAsFixed(4) +
                    ':gomin=' + blackPoint.toStringAsFixed(4) + ':bomin=' + blackPoint.toStringAsFixed(4) +
                    ':romax=' + whitePoint.toStringAsFixed(4) + ':gomax=' + whitePoint.toStringAsFixed(4) +
                    ':bomax=' + whitePoint.toStringAsFixed(4) + '[' + tone + ']');
                  previous = tone;
                }
                if (curvesPreset != 'Linear') {
                  final curve = 'vkop_curve';
                  final channel = curvesChannel == 'RGB' ? 'all' : curvesChannel.toLowerCase();
                  final points = curvesPreset == 'S-Curve' ? '0/0 0.25/0.18 0.5/0.5 0.75/0.82 1/1' :
                    curvesPreset == 'Strong Contrast' ? '0/0 0.25/0.12 0.5/0.5 0.75/0.9 1/1' :
                    curvesPreset == 'Matte' ? '0/0.08 0.25/0.28 0.5/0.55 0.75/0.8 1/0.94' :
                    curvesPreset == 'Fade' ? '0/0.06 0.25/0.28 0.5/0.53 0.75/0.8 1/0.96' :
                    curvesPreset == 'Brighten' ? '0/0 0.25/0.32 0.5/0.62 0.75/0.86 1/1' : '0/0 0.25/0.16 0.5/0.38 0.75/0.68 1/0.92';
                  filters.add('[' + previous + ']curves=' + channel + '=' + "'" + points + "'" + '[' + curve + ']');
                  previous = curve;
                }
                final hslLut = await buildHslLutFile();
                if (hslLut != null) {
                  final lutLabel = 'vkop_hsl_lut';
                  filters.add('[' + previous + ']lut3d=file=' + "'" + hslLut.replaceAll("'", "\\\\'") + "'" + '[' + lutLabel + ']');
                  previous = lutLabel;
                }
                if (customLutPath.isNotEmpty) {
                  final lutLabel = 'vkop_custom_lut';
                  filters.add('[' + previous + ']lut3d=file=' + "'" + customLutPath.replaceAll("'", "\\\\'") + "'" + '[' + lutLabel + ']');
                  previous = lutLabel;
                }
                if (sharpen > 0.1 || clarity > 0.1) {
                  final detail = 'vkop_detail';
                  final amount = (sharpen * .025 + clarity * .012).clamp(0.0, 5.0);
                  filters.add('[' + previous + ']unsharp=5:5:' + amount.toStringAsFixed(3) + ':5:5:0[' + detail + ']');
                  previous = detail;
                }
                if (grain > .1) {
                  final grainLabel = 'vkop_grain';
                  filters.add('[' + previous + ']noise=alls=' + (grain * .35).toStringAsFixed(2) + ':allf=t[' + grainLabel + ']');
                  previous = grainLabel;
                }
                if (fadeAmount > .1) {
                  final fadeLabel = 'vkop_fade_grade';
                  filters.add('[' + previous + ']eq=contrast=' + (1 - fadeAmount * .003).clamp(.5, 1.0).toStringAsFixed(3) +
                    ':brightness=' + (fadeAmount * .001).toStringAsFixed(3) + '[' + fadeLabel + ']');
                  previous = fadeLabel;
                }
                if (vignette > .1) {
                  final vignetteLabel = 'vkop_vignette';
                  filters.add('[' + previous + ']vignette=angle=' + (vignette * .007).clamp(0.0, 1.0).toStringAsFixed(3) + '[' + vignetteLabel + ']');
                  previous = vignetteLabel;
                }

                // Apply the selected color filter and image adjustments to the complete main track.
                // Base EQ is included in the grading chain above.
                if (filter == 'Warm') {
                  filters.add('[' + previous + ']colorbalance=rs=0.08:gs=0.025:bs=-0.08[' + 'warm_base]');
                  previous = 'warm_base';
                }
                if (motionBlurAmount > 0.01) {
                  final blur = 'motion_blur_base';
                  final frames = motionBlurAmount < .34 ? 2 : motionBlurAmount < .67 ? 3 : 4;
                  filters.add('[' + previous + ']tmix=frames=' + frames.toString() + ':weights=' +
                    "'" + List.filled(frames, '1').join(' ') + "'" + '[' + blur + ']');
                  previous = blur;
                }
                // Mix the graded adjustment layer over the untouched image, with selectable mask and intensity.
                {
                  final opacity = adjustmentOpacity.clamp(0.0, 1.0).toStringAsFixed(4);
                  var maskExpression = '1';
                  if (adjustmentMask == 'Split') maskExpression = 'lt(X,W/2)';
                  if (adjustmentMask == 'Mirror') maskExpression = 'gte(X,W/2)';
                  if (adjustmentMask == 'Circle') maskExpression = 'lte((X-W/2)*(X-W/2)+(Y-H/2)*(Y-H/2),pow(min(W,H)*0.38,2))';
                  if (adjustmentMask == 'Rectangle') maskExpression = 'between(X,W*0.2,W*0.8)*between(Y,H*0.2,H*0.8)';
                  if (adjustmentMask == 'Heart') maskExpression = 'lte(pow(X-W/2,2)/pow(W*0.32,2)+pow(Y-H*0.48,2)/pow(H*0.36,2),1)';
                  if (adjustmentMask == 'Star') maskExpression = 'lt(abs(X-W/2)+abs(Y-H/2),min(W,H)*0.48)';
                  final mixLabel = 'vkop_adjustment_layer_mix';
                  final blendExpression = 'if(' + maskExpression + ',A*(1-' + opacity + ')+B*' + opacity + ',A)';
                  filters.add('[vkop_original][' + previous + ']blend=all_expr=' + "'" + blendExpression + "'" + '[' + mixLabel + ']');
                  previous = mixLabel;
                }
                // Render clip entrance and exit animation on the complete composed timeline.
                if (animationPreset == 'Fade In' || animationPreset == 'Fade Out') {
                  final fadeLabel = 'animated_base';
                  final fadeDuration = projectDuration.clamp(.1, 1.0).toDouble();
                  final fadeFilter = animationPreset == 'Fade In'
                    ? 'fade=t=in:st=0:d=' + fadeDuration.toStringAsFixed(3) + ':alpha=0'
                    : 'fade=t=out:st=' + (projectDuration - fadeDuration).clamp(0, projectDuration).toStringAsFixed(3) +
                      ':d=' + fadeDuration.toStringAsFixed(3) + ':alpha=0';
                  filters.add('[' + previous + ']' + fadeFilter + '[' + fadeLabel + ']');
                  previous = fadeLabel;
                }
                for (var j = 0; j < exportOverlays.length; j++) {
                  final o = exportOverlays[j];
                  final inputIndex = clips.length + j;
                  final startTime = o.start.clamp(0, 86400).toDouble();
                  final safeStart = startTime.clamp(0, projectDuration > .05 ? projectDuration - .05 : 0).toDouble();
                  final endTime = (safeStart + o.duration).clamp(safeStart + .05, projectDuration > safeStart + .05 ? projectDuration : safeStart + .05).toDouble();
                  final overlayKeys = o.keyframes;
                  final scaleExpr = keyframeExpression(overlayKeys, 'scale', startTime, o.widthFactor);
                  final opacityExpr = keyframeExpression(overlayKeys, 'opacity', startTime, o.opacity);
                  final centerXExpr = keyframeExpression(overlayKeys, 'x', 0, o.centerX);
                  final centerYExpr = keyframeExpression(overlayKeys, 'y', 0, o.centerY);
                  final overlayWidth = (width * o.widthFactor).round().clamp(80, width).toInt();
                  final next = 'base' + (j + 1).toString();
                  final keyFilter = chromaKeyEnabled
                    ? ',chromakey=0x00FF00:' + chromaSimilarity.clamp(0, 1).toStringAsFixed(3) + ':' + chromaBlend.clamp(0, .5).toStringAsFixed(3)
                    : '';
                  final dynamicScale = overlayKeys.isEmpty ? overlayWidth.toString() : "'max(80," + width.toString() + '*' + scaleExpr + ")'";
                  final dynamicOpacity = overlayKeys.isEmpty
                    ? (o.opacity < .999 ? ',colorchannelmixer=aa=' + o.opacity.clamp(0, 1).toStringAsFixed(4) : '')
                    : ",geq=r='r(X,Y)':g='g(X,Y)':b='b(X,Y)':a='alpha(X,Y)*(" +
                      keyframeExpression(overlayKeys, 'opacity', startTime, o.opacity, timeVariable: 'T') + ")'";
                  filters.add('[' + inputIndex.toString() + ':v]setpts=PTS-STARTPTS,scale=w=' + dynamicScale +
                    ':h=-1:eval=frame,rotate=' + o.rotation.toStringAsFixed(4) + ':c=none:ow=rotw(iw):oh=roth(ih)' +
                    keyFilter + ',format=rgba' + dynamicOpacity + '[ov' + j.toString() + ']');
                  final x = width.toString() + '*' + centerXExpr + '-overlay_w/2';
                  final y = height.toString() + '*' + centerYExpr + '-overlay_h/2';
                  filters.add("[" + previous + "][ov" + j.toString() + "]overlay=x=" + x + ":y=" + y +
                    ":enable='between(t," + safeStart.toStringAsFixed(3) + "," + endTime.toStringAsFixed(3) +
                    ")':eof_action=pass[" + next + "]");
                  previous = next;
                }

                // Render zoom animation on the composed visual track before text and sticker layers.
                if (animationPreset == 'Zoom In' || animationPreset == 'Zoom Out') {
                  final zoomed = 'zoom_animated_base';
                  final zoomExpression = animationPreset == 'Zoom In'
                    ? '0.75+0.25*min(t/' + projectDuration.toStringAsFixed(3) + ',1)'
                    : '1.25-0.25*min(t/' + projectDuration.toStringAsFixed(3) + ',1)';
                  filters.add('[' + previous + ']scale=' + (width * 1.34).round().toString() + ':' + (height * 1.34).round().toString() +
                    ',crop=w="' + width.toString() + '/(' + zoomExpression + '):h=' + height.toString() + '/(' + zoomExpression + ')",eval=frame:x=(iw-ow)/2:y=(ih-oh)/2,scale=' + width.toString() + ':' + height.toString() + '[' + zoomed + ']');
                  previous = zoomed;
                }

                // Build a synchronized audio mix from original clip audio and every enabled music track.
                final audioLabels = <String>[];
                var audioInputIndex = clips.length + exportOverlays.length;
                var audioTimelineStart = 0.0;
                for (var i = 0; i < audioInputs.length; i++) {
                  final input = audioInputs[i];
                  final startMs = ((input['start'] as double) * 1000).round();
                  final duration = input['duration'] as double;
                  final volume = (input['volume'] as double).clamp(0, 2).toDouble();
                  final audioSpeed = (input['speed'] as double).clamp(.1, 16).toDouble();
                  final tempoFilters = <String>[];
                  var factor = audioSpeed;
                  while (factor < .5) { tempoFilters.add('atempo=0.5'); factor /= .5; }
                  while (factor > 2) { tempoFilters.add('atempo=2'); factor /= 2; }
                  tempoFilters.add('atempo=' + factor.toStringAsFixed(4));
                  final label = 'aud' + i.toString();
                  final audioEffects = <String>[];
                  if ((input['voice'] as bool? ?? false) && noiseReductionEnabled) {
                    audioEffects.add('afftdn=nf=-25');
                  }
                  if (input['voice'] as bool? ?? false) {
                    switch (voiceEffect) {
                      case 'Deep':
                        audioEffects.addAll(['asetrate=40800', 'aresample=48000', 'atempo=1.1765']);
                        break;
                      case 'High':
                        audioEffects.addAll(['asetrate=57600', 'aresample=48000', 'atempo=0.8333']);
                        break;
                      case 'Robot':
                        audioEffects.addAll(['tremolo=f=30:d=0.75', 'aecho=0.8:0.88:40:0.35']);
                        break;
                      case 'Echo':
                        audioEffects.add('aecho=0.8:0.9:80:0.4');
                        break;
                    }
                  }
                  final keyframes = input['keyframes'] as List<KeyframePoint>? ?? <KeyframePoint>[];
                  final curveSegments = input['curveSegments'] as List<Map<String, double>>? ?? <Map<String, double>>[];
                  if (curveSegments.isNotEmpty) {
                    final splitLabels = List.generate(curveSegments.length, (k) => '[audio_split_' + i.toString() + '_' + k.toString() + ']').join();
                    filters.add('[' + audioInputIndex.toString() + ':a]asplit=' + curveSegments.length.toString() + splitLabels);
                    var curveAudioOffset = 0.0;
                    for (var k = 0; k < curveSegments.length; k++) {
                      final segment = curveSegments[k];
                      final segmentSpeed = segment['speed']!.clamp(.1, 16).toDouble();
                      final segmentTempo = <String>[];
                      var segmentFactor = segmentSpeed;
                      while (segmentFactor < .5) { segmentTempo.add('atempo=0.5'); segmentFactor /= .5; }
                      while (segmentFactor > 2) { segmentTempo.add('atempo=2'); segmentFactor /= 2; }
                      segmentTempo.add('atempo=' + segmentFactor.toStringAsFixed(4));
                      final segmentVolume = keyframes.isEmpty
                        ? volume.toStringAsFixed(3)
                        : keyframeVolumeExpression(keyframes, (input['start'] as double) + curveAudioOffset);
                      final segmentLabel = 'aud' + i.toString() + '_curve_' + k.toString();
                      final segmentStartMs = (((input['start'] as double) + curveAudioOffset) * 1000).round();
                      final segmentChain = <String>[...segmentTempo, ...audioEffects, 'volume=' + segmentVolume + ':eval=frame'];
                      filters.add('[audio_split_' + i.toString() + '_' + k.toString() + ']atrim=start=' +
                        segment['offset']!.toStringAsFixed(4) + ':duration=' + segment['source']!.toStringAsFixed(4) +
                        ',asetpts=PTS-STARTPTS,' + segmentChain.join(',') +
                        ',adelay=' + segmentStartMs.toString() + '|' + segmentStartMs.toString() +
                        ',apad,atrim=duration=' + projectDuration.toStringAsFixed(3) + '[' + segmentLabel + ']');
                      audioLabels.add('[' + segmentLabel + ']');
                      curveAudioOffset += segment['output']!;
                    }
                    audioInputIndex++;
                    continue;
                  }
                  final volumeExpression = keyframes.isEmpty
                    ? volume.toStringAsFixed(3)
                    : keyframeVolumeExpression(keyframes, input['start'] as double);
                  final audioFilterChain = <String>[...tempoFilters, ...audioEffects, 'volume=' + volumeExpression + ':eval=frame'];
                  filters.add('[' + audioInputIndex.toString() + ':a]asetpts=PTS-STARTPTS,' +
                    audioFilterChain.join(',') +
                    ',adelay=' + startMs.toString() + '|' + startMs.toString() +
                    ',apad,atrim=duration=' + projectDuration.toStringAsFixed(3) + '[' + label + ']');
                  audioLabels.add('[' + label + ']');
                  audioInputIndex++;
                }
                if (audioLabels.isNotEmpty) {
                  filters.add(audioLabels.join() + 'amix=inputs=' + audioLabels.length.toString() +
                    ':duration=longest:dropout_transition=0,alimiter=limit=0.95[aout]');
                }

                // Apply the selected alpha mask to the final composition.
                if (maskShape == 'Circle' || maskShape == 'Oval' || maskShape == 'Rounded' || stylePreset == 'Rounded') {
                  final masked = 'masked_output';
                  final alphaExpression = maskShape == 'Circle'
                    ? "if(lte((X-W/2)*(X-W/2)+(Y-H/2)*(Y-H/2),(min(W,H)/2)*(min(W,H)/2)),alpha(X,Y),0)"
                    : maskShape == 'Oval'
                      ? "if(lte(((X-W/2)/(W/2))*((X-W/2)/(W/2))+((Y-H/2)/(H/2))*((Y-H/2)/(H/2)),1),alpha(X,Y),0)"
                      : "if(lte(pow(max(abs(X-W/2)-(W/2-min(W,H)*0.06),0),2)+pow(max(abs(Y-H/2)-(H/2-min(W,H)*0.06),0),2),pow(min(W,H)*0.06,2)),alpha(X,Y),0)";
                  filters.add("[" + previous + "]format=rgba,geq=a='" + alphaExpression + "'[" + masked + "]");
                  previous = masked;
                }

                // Render editable text and sticker layers into the final video.
                if (overlayText.trim().isNotEmpty) {
                  final safeText = escapeFfmpegText(overlayText.trim());
                  final textColor = switch (textColorName) {
                    'Black' => 'black', 'Yellow' => 'yellow', 'Purple' => '0xFFB99AFF',
                    'Red' => 'red', _ => 'white'
                  };
                  final textOutput = 'text_rendered';
                  final fontSize = (textSize * width / 360).round().clamp(18, 220);
                  var textX = '(w-text_w)/2';
                  var textY = 'h*0.82';
                  var textAlpha = '1';
                  var textSizeExpression = fontSize.toString();
                  switch (textAnimationPreset) {
                    case 'Fade In': textAlpha = "if(lt(t\\,0.65)\\,t/0.65\\,1)"; break;
                    case 'Fade Out': textAlpha = "if(gt(t\\," + (projectDuration - .65).clamp(0, projectDuration).toStringAsFixed(3) + ")\\,(" + projectDuration.toStringAsFixed(3) + "-t)/0.65\\,1)"; break;
                    case 'Slide Up': textY = "h*0.82+max(0\\,(0.65-t))*120"; break;
                    case 'Slide Down': textY = "h*0.82-max(0\\,(0.65-t))*120"; break;
                    case 'Slide Left': textX = "(w-text_w)/2+max(0\\,(0.65-t))*180"; break;
                    case 'Slide Right': textX = "(w-text_w)/2-max(0\\,(0.65-t))*180"; break;
                    case 'Zoom In': textSizeExpression = "max(1\\," + fontSize.toString() + "*min(t/0.65\\,1))"; break;
                    case 'Zoom Out': textSizeExpression = "max(1\\," + fontSize.toString() + "*(1.5-0.5*min(t/0.65\\,1)))"; break;
                    case 'Pop': textSizeExpression = "max(1\\," + fontSize.toString() + "*(0.7+0.3*min(t/0.25\\,1)))"; break;
                    case 'Bounce': textY = "h*0.82+abs(sin(t*12))*max(0\\,(0.65-t))*100"; break;
                    case 'Typewriter': textAlpha = "if(gte(t\\,0.15)\\,1\\,0)"; break;
                  }
                  final boldFont = textBold && selectedTextFont == 'Roboto' ? '/system/fonts/Roboto-Bold.ttf' : textFontFile;
                  filters.add('[' + previous + ']drawtext=fontfile=' + boldFont + ':text=' +
                    "'" + safeText + "'" + ':fontcolor=' + textColor + ':fontsize=' + textSizeExpression +
                    ':x=' + textX + ':y=' + textY + ':alpha=' + "'" + textAlpha + "'" + ':shadowcolor=black@0.8:shadowx=2:shadowy=2[' + textOutput + ']');
                  previous = textOutput;
                }
                if (selectedSticker.isNotEmpty) {
                  final safeSticker = escapeFfmpegText(selectedSticker);
                  final stickerOutput = 'sticker_rendered';
                  filters.add('[' + previous + ']drawtext=fontfile=/system/fonts/NotoColorEmoji.ttf:text=' +
                    "'" + safeSticker + "'" + ':fontcolor=white:fontsize=' + (width * .16).round().clamp(36, 260).toString() +
                    ':x=w-text_w-24:y=24:shadowcolor=black@0.7:shadowx=2:shadowy=2[' + stickerOutput + ']');
                  previous = stickerOutput;
                }

                // Render the selected decorative frame style into the exported video.
                if (stylePreset == 'Border') {
                  final framed = 'styled_border_base';
                  filters.add('[' + previous + ']drawbox=x=0:y=0:w=iw:h=ih:color=0x7653D6@0.95:t=' +
                    (width * 0.008).round().clamp(3, 24).toString() + '[' + framed + ']');
                  previous = framed;
                } else if (stylePreset == 'Shadow') {
                  final shadowed = 'styled_shadow_base';
                  filters.add('[' + previous + ']drawbox=x=8:y=8:w=iw-16:h=ih-16:color=black@0.45:t=' +
                    (width * 0.012).round().clamp(4, 28).toString() + '[' + shadowed + ']');
                  previous = shadowed;
                }

                final bitrate = size >= 2160 ? '35000000' : size >= 1440 ? '20000000' : size >= 1080 ? '10000000' : '5000000';
                args.addAll(['-filter_complex', filters.join(';'), '-map', '[' + previous + ']']);
                if (audioLabels.isNotEmpty) args.addAll(['-map', '[aout]', '-c:a', 'aac', '-b:a', '192k']);
                else args.addAll(['-an']);
                args.addAll(['-c:v', 'libx264', '-preset', 'veryfast', '-crf', '20', '-profile:v', 'main',
                  '-tag:v', 'avc1', '-b:v', bitrate, '-r', exportFps.toString(), '-pix_fmt', 'yuv420p',
                  '-movflags', '+faststart', '-f', 'mp4']);
                final outputPath = documents.path + '/VKOP_' + DateTime.now().millisecondsSinceEpoch.toString() + '.mp4';
                args.addAll(['-t', projectDuration.toStringAsFixed(3), outputPath]);
                await ffmpegChannel.invokeMethod<String>('execute', {'arguments': args});
                final outputFile = File(outputPath);
                if (!await outputFile.exists() || await outputFile.length() < 1024) {
                  throw Exception('FFmpeg did not create a valid MP4 file.');
                }
                final fileName = outputPath.split('/').last;
                await ffmpegChannel.invokeMethod<String>('saveToDownloads', {'sourcePath': outputPath, 'fileName': fileName});
                if (!mounted) return;
                setState(() { exporting = false; exportProgress = 1; });
                toast('Export saved to Movies/VKOP/' + fileName);
              } on PlatformException catch (e) {
                if (!mounted) return;
                setState(() { exporting = false; exportProgress = 0; });
                toast('Export failed: ' + (e.message ?? 'FFmpeg error'));
              } catch (e) {
                if (!mounted) return;
                setState(() { exporting = false; exportProgress = 0; });
                toast('Export error: ' + e.toString());
              } finally {
                for (final file in temporaryAudioFiles) {
                  try { if (await file.exists()) await file.delete(); } catch (_) {}
                }
              }
            }

            Widget preview() {
              final item = current;
              final originalAspect = player?.value.isInitialized == true ? player!.value.aspectRatio : 16 / 9;
              Widget mediaContent;
              if (loading) {
                mediaContent = const Center(child: CircularProgressIndicator());
              } else if (item == null) {
                mediaContent = const Center(child: Text('No clip selected', style: TextStyle(color: Colors.white70)));
              } else if (!item.isVideo) {
                mediaContent = Image.file(File(item.path), fit: BoxFit.contain, errorBuilder: (_, __, ___) => const Icon(Icons.broken_image, color: Colors.white));
              } else if (player == null || !player!.value.isInitialized) {
                mediaContent = const Center(child: Text('Video preview unavailable', style: TextStyle(color: Colors.white70)));
              } else {
                mediaContent = AspectRatio(aspectRatio: originalAspect, child: VideoPlayer(player!));
              }
              return LayoutBuilder(builder: (context, constraints) {
                final availableW = constraints.maxWidth;
                final availableH = constraints.maxHeight;
                final ratio = aspect;
                final canvasW = availableW / availableH > ratio ? availableH * ratio : availableW;
                final canvasH = canvasW / ratio;
                final clipScale = item?.scale ?? 1.0;
                final clipOpacity = item?.opacity ?? 1.0;
                final animationProgress = (playhead / ((item?.duration ?? 1) < 1 ? (item?.duration ?? 1) : 1)).clamp(0.0, 1.0).toDouble();
                final animationScale = animationPreset == 'Zoom In' ? .75 + .25 * animationProgress : animationPreset == 'Zoom Out' ? 1.25 - .25 * animationProgress : 1.0;
                final animationOpacity = animationPreset == 'Fade In' ? animationProgress : animationPreset == 'Fade Out' ? 1.0 - animationProgress : 1.0;
                return Stack(clipBehavior: Clip.hardEdge, children: [
                  Center(
                    child: SizedBox(
                      width: canvasW,
                      height: canvasH,
                      child: ClipRect(
                        child: Stack(clipBehavior: Clip.hardEdge, children: [
                          Positioned.fill(child: ColoredBox(color: canvasBackground)),
                          Positioned.fill(child: Center(child: Transform.translate(
                            offset: Offset(canvasW * ((item?.positionX ?? .5) - .5), canvasH * ((item?.positionY ?? .5) - .5)),
                            child: Transform.rotate(
                              angle: item?.rotation ?? 0,
                              child: Transform.scale(
                                scale: clipScale * animationScale,
                                child: Opacity(
                                  opacity: (clipOpacity * animationOpacity).clamp(0, 1).toDouble(),
                                  child: ClipPath(
                                    clipper: maskShape == 'Circle' ? _CircleClipper() : maskShape == 'Oval' ? _OvalClipper() : null,
                                    child: GestureDetector(
