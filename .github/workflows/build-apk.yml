            Future<void> addOverlay() async {
              try {
                final r = await FilePicker.pickFiles(type: FileType.media);
                if (r.isEmpty) return;
                const vids = {'mp4','m4v','mov','3gp','3gpp','mkv','webm','avi','ts','mts','m2ts','mpg','mpeg','wmv','flv','ogv'};
                const imgs = {'jpg','jpeg','png','webp','gif','bmp','heic','heif','avif','tif','tiff'};
                final added = <OverlayClip>[];
                for (final f in r) {
                  if (f.path == null) continue;
                  final ext = (f.extension ?? '').toLowerCase(); final isVideo = vids.contains(ext);
                  if (!isVideo && !imgs.contains(ext)) continue;
                  final layer = OverlayClip(path: f.path!, name: f.name, isVideo: isVideo);
                  if (isVideo) {
                    try {
                      final c = VideoPlayerController.file(File(layer.path)); await c.initialize();
                      layer.duration = c.value.duration.inMilliseconds / 1000;
                      await c.setLooping(true); await c.setVolume(0); await c.pause(); overlayPlayers[layer.id] = c;
                    } catch (_) { layer.duration = 3; }
                  }
                  added.add(layer);
                }
                if (!mounted || added.isEmpty) return;
                setState(() { overlays.addAll(added); selectedOverlay = overlays.length - 1; activeTool = 'Overlay'; });
                toast('${added.length} overlay layer(s) added. Drag or pinch them on the preview.');
              } catch (e) { toast('Could not add overlay: $e'); }
            }

            void deleteOverlay() {
              final o = currentOverlay; if (o == null) return;
              final c = overlayPlayers.remove(o.id); c?.dispose();
              setState(() { overlays.removeAt(selectedOverlay); selectedOverlay = overlays.isEmpty ? -1 : (selectedOverlay >= overlays.length ? overlays.length - 1 : selectedOverlay); });
            }

            void beginOverlayGesture(ScaleStartDetails d) {
              final o = currentOverlay; if (o == null) return;
              _gestureScale = o.widthFactor; _gestureX = o.centerX; _gestureY = o.centerY; _gestureRotation = o.rotation; _gestureFocal = d.focalPoint;
            }
            void updateOverlayGesture(ScaleUpdateDetails d, Size size) {
              final o = currentOverlay; if (o == null) return;
              setState(() {
                o.widthFactor = (_gestureScale * d.scale).clamp(.12, .9);
                o.centerX = (_gestureX + (d.focalPoint.dx - _gestureFocal.dx) / size.width).clamp(0.05, .95);
                o.centerY = (_gestureY + (d.focalPoint.dy - _gestureFocal.dy) / size.height).clamp(0.05, .95);
                o.rotation = _gestureRotation + d.rotation;
              });
            }

