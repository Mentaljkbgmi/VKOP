
name: Build VKOP Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --org com.vkop --project-name ai --platforms android app

      - name: Set VKOP app name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = re.sub(r'android:label="[^"]*"', 'android:label="VKOP"', s, count=1)
          p.write_text(s)
          assert 'android:label="VKOP"' in s
          print("VKOP app name configured")
          PY

      - name: Add video dependencies
        working-directory: app
        run: |
          flutter pub add file_picker
          flutter pub add video_player

      - name: Create VKOP video preview app
        run: |
          cat > app/lib/main.dart <<'EOF'
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:video_player/video_player.dart';

          void main() {
            runApp(const VKOPApp());
          }

          class VKOPApp extends StatelessWidget {
            const VKOPApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'VKOP',
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF101018),
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: Colors.deepPurpleAccent,
                    brightness: Brightness.dark,
                  ),
                ),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            String? selectedPath;
            String? selectedName;
            bool selecting = false;

            Future<void> selectVideo() async {
              setState(() => selecting = true);

              try {
                final files = await FilePicker.pickFiles(
                  type: FileType.video,
                );

                if (!mounted) return;

                if (files.isNotEmpty) {
                  final file = files.first;

                  if (file.path == null) {
                    ScaffoldMessenger.of(context).showSnackBar(
                      const SnackBar(
                        content: Text('Please select a video stored on your device.'),
                      ),
                    );
                  } else {
                    setState(() {
                      selectedPath = file.path;
                      selectedName = file.name;
                    });
                  }
                }
              } catch (e) {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(content: Text('Video selection failed: $e')),
                  );
                }
              } finally {
                if (mounted) {
                  setState(() => selecting = false);
                }
              }
            }

            void importVideo() {
              if (selectedPath == null) return;

              Navigator.push(
                context,
                MaterialPageRoute(
                  builder: (_) => VideoPreviewScreen(
                    videoPath: selectedPath!,
                    videoName: selectedName ?? 'Selected video',
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text(
                    'VKOP',
                    style: TextStyle(
                      fontWeight: FontWeight.bold,
                      letterSpacing: 3,
                    ),
                  ),
                  centerTitle: true,
                ),
                body: Center(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.all(24),
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        const Icon(
                          Icons.auto_awesome,
                          size: 75,
                          color: Colors.deepPurpleAccent,
                        ),
                        const SizedBox(height: 20),
                        const Text(
                          'Remove. Replace. Create.',
                          textAlign: TextAlign.center,
                          style: TextStyle(
                            fontSize: 24,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        const SizedBox(height: 10),
                        const Text(
                          'AI VIDEO BACKGROUND REMOVER',
                          style: TextStyle(
                            color: Colors.white54,
                            letterSpacing: 2,
                            fontSize: 11,
                          ),
                        ),
                        const SizedBox(height: 55),
                        const Icon(
                          Icons.video_library_outlined,
                          size: 65,
                          color: Colors.deepPurpleAccent,
                        ),
                        const SizedBox(height: 20),
                        const Text(
                          'Choose a video to get started',
                          textAlign: TextAlign.center,
                        ),
                        const SizedBox(height: 20),
                        SizedBox(
                          width: double.infinity,
                          child: OutlinedButton.icon(
                            onPressed: selecting ? null : selectVideo,
                            icon: const Icon(Icons.video_file),
                            label: Text(
                              selecting ? 'PLEASE WAIT...' : 'SELECT VIDEO',
                            ),
                          ),
                        ),
                        if (selectedName != null) ...[
                          const SizedBox(height: 20),
                          Container(
                            width: double.infinity,
                            padding: const EdgeInsets.all(14),
                            decoration: BoxDecoration(
                              color: Colors.white10,
                              borderRadius: BorderRadius.circular(12),
                            ),
                            child: Row(
                              children: [
                                const Icon(
                                  Icons.movie,
                                  color: Colors.deepPurpleAccent,
                                ),
                                const SizedBox(width: 12),
                                Expanded(
                                  child: Text(
                                    selectedName!,
                                    maxLines: 2,
                                    overflow: TextOverflow.ellipsis,
                                  ),
                                ),
                              ],
                            ),
                          ),
                          const SizedBox(height: 18),
                          SizedBox(
                            width: double.infinity,
                            child: FilledButton.icon(
                              onPressed: importVideo,
                              icon: const Icon(Icons.download_done),
                              label: const Text('IMPORT VIDEO'),
                            ),
                          ),
                        ],
                        const SizedBox(height: 55),
                        const Text(
                          'FREE  •  OFFLINE  •  NO WATERMARK',
                          style: TextStyle(
                            color: Colors.white38,
                            fontSize: 10,
                            letterSpacing: 1,
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class VideoPreviewScreen extends StatefulWidget {
            final String videoPath;
            final String videoName;

            const VideoPreviewScreen({
              super.key,
              required this.videoPath,
              required this.videoName,
            });

            @override
            State<VideoPreviewScreen> createState() =>
                _VideoPreviewScreenState();
          }

          class _VideoPreviewScreenState
              extends State<VideoPreviewScreen> {
            late final VideoPlayerController controller;
            bool loading = true;
            String? errorMessage;

            @override
            void initState() {
              super.initState();
              controller = VideoPlayerController.file(
                File(widget.videoPath),
              );
              initializeVideo();
            }

            Future<void> initializeVideo() async {
              try {
                await controller.initialize();
                await controller.setLooping(false);
                if (mounted) {
                  setState(() => loading = false);
                }
              } catch (e) {
                if (mounted) {
                  setState(() {
                    loading = false;
                    errorMessage = 'Unable to play this video: $e';
                  });
                }
              }
            }

            String formatTime(Duration duration) {
              final minutes = duration.inMinutes;
              final seconds = duration.inSeconds % 60;
              return '$minutes:${seconds.toString().padLeft(2, '0')}';
            }

            @override
            void dispose() {
              controller.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('VIDEO PREVIEW'),
                  centerTitle: true,
                ),
                body: SafeArea(
                  child: Padding(
                    padding: const EdgeInsets.all(16),
                    child: Column(
                      children: [
                        Text(
                          widget.videoName,
                          maxLines: 2,
                          overflow: TextOverflow.ellipsis,
                          textAlign: TextAlign.center,
                          style: const TextStyle(
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        const SizedBox(height: 24),
                        Expanded(
                          child: Center(
                            child: loading
                                ? const CircularProgressIndicator()
                                : errorMessage != null
                                    ? Text(
                                        errorMessage!,
                                        textAlign: TextAlign.center,
                                      )
                                    : AspectRatio(
                                        aspectRatio:
                                            controller.value.aspectRatio,
                                        child: VideoPlayer(controller),
                                      ),
                          ),
                        ),
                        if (!loading && errorMessage == null)
                          ValueListenableBuilder<VideoPlayerValue>(
                            valueListenable: controller,
                            builder: (context, value, child) {
                              final total =
                                  value.duration.inMilliseconds.toDouble();
                              final current = value
                                  .position.inMilliseconds
                                  .toDouble()
                                  .clamp(0.0, total > 0 ? total : 1.0);

                              return Column(
                                children: [
                                  Row(
                                    children: [
                                      Text(formatTime(value.position)),
                                      Expanded(
                                        child: Slider(
                                          value: current,
                                          min: 0,
                                          max: total > 0 ? total : 1,
                                          onChanged: total > 0
                                              ? (v) {
                                                  controller.seekTo(
                                                    Duration(
                                                      milliseconds: v.round(),
                                                    ),
                                                  );
                                                }
                                              : null,
                                        ),
                                      ),
                                      Text(formatTime(value.duration)),
                                    ],
                                  ),
                                  IconButton.filled(
                                    iconSize: 36,
                                    onPressed: () {
                                      if (value.isPlaying) {
                                        controller.pause();
                                      } else {
                                        controller.play();
                                      }
                                    },
                                    icon: Icon(
                                      value.isPlaying
                                          ? Icons.pause
                                          : Icons.play_arrow,
                                    ),
                                  ),
                                ],
                              );
                            },
                          ),
                        const SizedBox(height: 20),
                        SizedBox(
                          width: double.infinity,
                          child: OutlinedButton.icon(
                            onPressed: () => Navigator.pop(context),
                            icon: const Icon(Icons.swap_horiz),
                            label: const Text('CHANGE VIDEO'),
                          ),
                        ),
                        const SizedBox(height: 12),
                        SizedBox(
                          width: double.infinity,
                          child: FilledButton.icon(
                            onPressed: null,
                            icon: const Icon(Icons.auto_awesome),
                            label: const Text('REMOVE BACKGROUND - COMING NEXT'),
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          EOF

      - name: Build APK
        working-directory: app
        run: |
          set -o pipefail
          flutter pub get
          flutter build apk --release --verbose 2>&1 | tee build-log.txt

      - name: Upload Build Error Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VKOP-Build-Log
          path: app/build-log.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VKOP-Android-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
