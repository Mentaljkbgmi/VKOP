name: Build VKOP Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --org com.vkop --project-name ai --platforms android app
        
      - name: Set VKOP app name
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:label="ai"', 'android:label="VKOP"')
          s = s.replace('android:label="app"', 'android:label="VKOP"')
          p.write_text(s)

          assert 'android:label="VKOP"' in s, "VKOP app label was not set!"
          print("Launcher name successfully set to VKOP")
          PY

          
      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VKOP-Android-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
          
