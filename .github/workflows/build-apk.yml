      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VKOP-Android-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
