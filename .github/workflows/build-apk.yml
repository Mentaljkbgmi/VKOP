              final layer = OverlayClip(path: '', name: 'Text: ${value}', isVideo: false, kind: 'text', content: value)
                ..start = projectTime
                ..duration = (totalTimelineDuration - projectTime).clamp(.5, 3600).toDouble()
                ..widthFactor = .78
                ..textSize = textSize
                ..textColor = selectedTextColor
                ..textBold = textBold;
              setState(() { overlays.add(layer); selectedOverlay = overlays.length - 1; selectedAudio = -1; overlayText = ''; activeTool = 'Overlay'; });
