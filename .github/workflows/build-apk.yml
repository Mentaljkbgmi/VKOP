
name: Build VKOP Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          flutter create --org com.vkop --project-name ai --platforms android app

      - name: Set Android app name
        run: |
          sed -i 's/android:label="ai"/android:label="VKOP"/' app/android/app/src/main/AndroidManifest.xml

      - name: Install packages
        working-directory: app
        run: |
          flutter pub add file_picker
          flutter pub add video_player

      - name: Create VKOP Editor
        working-directory: app
        run: |
          cat > lib/main.dart <<'EOF'
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:video_player/video_player.dart';

          void main() {
            runApp(const VKOPApp());
          }

          class VideoClip {
            final String path;
            final String name;
            double trimStart = 0;
            double trimEnd = 0;
            double duration = 0;

            VideoClip({
              required this.path,
              required this.name,
            });
          }

          class VKOPApp extends StatelessWidget {
            const VKOPApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'VKOP',
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF101014),
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: Colors.deepPurple,
                    brightness: Brightness.dark,
                  ),
                  useMaterial3: true,
                ),
                home: const EditorPage(),
              );
            }
          }

          class EditorPage extends StatefulWidget {
            const EditorPage({super.key});

            @override
            State<EditorPage> createState() => _EditorPageState();
          }

          class _EditorPageState extends State<EditorPage> {
            final List<VideoClip> clips = [];

            VideoPlayerController? controller;

            int selectedIndex = -1;
            int loadToken = 0;
            bool loading = false;

            String cropRatio = 'Original';

            double get maxDuration {
              if (selectedIndex < 0 ||
                  selectedIndex >= clips.length) {
                return 1;
              }

              return clips[selectedIndex].duration > 0
                  ? clips[selectedIndex].duration
                  : 1;
            }

            Future<void> pickVideos() async {
              try {
                final result = await FilePicker.pickFiles(
                  type: FileType.video,
                  allowMultiple: true,
                );

                if (result == null || result.files.isEmpty) {
                  return;
                }

                final newClips = result.files
                    .where((file) => file.path != null)
                    .map((file) => VideoClip(
                          path: file.path!,
                          name: file.name,
                        ))
                    .toList();

                if (newClips.isEmpty) return;

                setState(() {
                  clips.addAll(newClips);
                });

                if (selectedIndex == -1) {
                  await selectClip(0);
                }
              } catch (e) {
                showMessage('Unable to select videos: $e');
              }
            }

            Future<void> selectClip(int index) async {
              if (index < 0 || index >= clips.length) return;

              final token = ++loadToken;

              final oldController = controller;
              controller = null;

              if (mounted) {
                setState(() {
                  selectedIndex = index;
                  loading = true;
                });
              }

              if (oldController != null) {
                await oldController.dispose();
              }

              try {
                final clip = clips[index];

                final newController =
                    VideoPlayerController.file(File(clip.path));

                await newController.initialize();

                if (!mounted || token != loadToken) {
                  await newController.dispose();
                  return;
                }

                clip.duration =
                    newController.value.duration.inMilliseconds / 1000;

                if (clip.trimEnd <= 0 ||
                    clip.trimEnd > clip.duration) {
                  clip.trimEnd = clip.duration;
                }

                controller = newController;

                await newController.setLooping(true);

                if (clip.trimStart > 0) {
                  await newController.seekTo(
                    Duration(
                      milliseconds:
                          (clip.trimStart * 1000).round(),
                    ),
                  );
                }

                if (mounted && token == loadToken) {
                  setState(() {
                    loading = false;
                  });
                }
              } catch (e) {
                if (mounted && token == loadToken) {
                  setState(() {
                    loading = false;
                  });
                  showMessage('Video could not be opened: $e');
                }
              }
            }

            Future<void> removeClip(int index) async {
              if (index < 0 || index >= clips.length) return;

              final wasSelected = index == selectedIndex;

              if (wasSelected) {
                final oldController = controller;
                controller = null;
                ++loadToken;

                if (oldController != null) {
                  await oldController.dispose();
                }
              }

              setState(() {
                clips.removeAt(index);

                if (clips.isEmpty) {
                  selectedIndex = -1;
                } else if (index < selectedIndex) {
                  selectedIndex--;
                } else if (wasSelected) {
                  selectedIndex =
                      index >= clips.length ? clips.length - 1 : index;
                }
              });

              if (clips.isNotEmpty &&
                  (wasSelected || selectedIndex >= 0)) {
                await selectClip(selectedIndex);
              }
            }

            Future<void> togglePlayback() async {
              final c = controller;
              if (c == null || !c.value.isInitialized) return;

              final clip = clips[selectedIndex];

              if (c.value.isPlaying) {
                await c.pause();
              } else {
                final position =
                    c.value.position.inMilliseconds / 1000;

                if (position < clip.trimStart ||
                    position >= clip.trimEnd) {
                  await c.seekTo(
                    Duration(
                      milliseconds:
                          (clip.trimStart * 1000).round(),
                    ),
                  );
                }

                await c.play();
              }

              if (mounted) setState(() {});
            }

            void updateTrim(RangeValues values) {
              if (selectedIndex < 0) return;

              setState(() {
                final clip = clips[selectedIndex];
                clip.trimStart = values.start;
                clip.trimEnd = values.end;
              });
            }

            double get cropAspectRatio {
              switch (cropRatio) {
                case '9:16':
                  return 9 / 16;
                case '16:9':
                  return 16 / 9;
                case '1:1':
                  return 1;
                default:
                  return controller?.value.aspectRatio ?? 16 / 9;
              }
            }

            void showMessage(String message) {
              if (!mounted) return;

              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(content: Text(message)),
              );
            }

            String formatTime(double seconds) {
              final total = seconds.floor();
              final minutes = total ~/ 60;
              final secs = total % 60;

              return '${minutes.toString().padLeft(2, '0')}:'
                  '${secs.toString().padLeft(2, '0')}';
            }

            @override
            void dispose() {
              controller?.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final clip = selectedIndex >= 0 &&
                      selectedIndex < clips.length
                  ? clips[selectedIndex]
                  : null;

              return Scaffold(
                appBar: AppBar(
                  title: const Text(
                    'VKOP EDITOR',
                    style: TextStyle(
                      fontWeight: FontWeight.bold,
                      letterSpacing: 2,
                    ),
                  ),
                  actions: [
                    IconButton(
                      onPressed: pickVideos,
                      icon: const Icon(Icons.add_circle_outline),
                      tooltip: 'Add videos',
                    ),
                  ],
                ),

                body: SafeArea(
                  child: Column(
                    children: [
                      Expanded(
                        child: SingleChildScrollView(
                          padding: const EdgeInsets.all(14),
                          child: Column(
                            crossAxisAlignment:
                                CrossAxisAlignment.start,
                            children: [
                              const Text(
                                'PREVIEW',
                                style: TextStyle(
                                  fontWeight: FontWeight.bold,
                                  letterSpacing: 1.5,
                                ),
                              ),

                              const SizedBox(height: 12),

                              Container(
                                width: double.infinity,
                                height: 300,
                                decoration: BoxDecoration(
                                  color: Colors.black,
                                  borderRadius:
                                      BorderRadius.circular(14),
                                  border: Border.all(
                                    color: Colors.white12,
                                  ),
                                ),
                                child: Center(
                                  child: loading
                                      ? const CircularProgressIndicator()
                                      : controller != null &&
                                              controller!.value.isInitialized
                                          ? ClipRect(
                                              child: AspectRatio(
                                                aspectRatio:
                                                    cropAspectRatio,
                                                child: FittedBox(
                                                  fit: BoxFit.cover,
                                                  child: SizedBox(
                                                    width: controller!
                                                        .value.size.width,
                                                    height: controller!
                                                        .value.size.height,
                                                    child: VideoPlayer(
                                                      controller!,
                                                    ),
                                                  ),
                                                ),
                                              ),
                                            )
                                          : const Column(
                                              mainAxisAlignment:
                                                  MainAxisAlignment.center,
                                              children: [
                                                Icon(
                                                  Icons.movie_outlined,
                                                  size: 55,
                                                  color: Colors.white38,
                                                ),
                                                SizedBox(height: 10),
                                                Text('Select videos to start'),
                                              ],
                                            ),
                                ),
                              ),

                              const SizedBox(height: 12),

                              Center(
                                child: IconButton.filled(
                                  onPressed: controller == null
                                      ? null
                                      : togglePlayback,
                                  iconSize: 32,
                                  icon: Icon(
                                    controller?.value.isPlaying == true
                                        ? Icons.pause
                                        : Icons.play_arrow,
                                  ),
                                ),
                              ),

                              const SizedBox(height: 20),

                              Row(
                                mainAxisAlignment:
                                    MainAxisAlignment.spaceBetween,
                                children: [
                                  const Text(
                                    'TIMELINE',
                                    style: TextStyle(
                                      fontWeight: FontWeight.bold,
                                      letterSpacing: 1.5,
                                    ),
                                  ),
                                  Text(
                                    '${clips.length} clips',
                                    style: const TextStyle(
                                      color: Colors.white54,
                                    ),
                                  ),
                                ],
                              ),

                              const SizedBox(height: 10),

                              if (clips.isEmpty)
                                Container(
                                  width: double.infinity,
                                  padding: const EdgeInsets.all(25),
                                  decoration: BoxDecoration(
                                    color: const Color(0xFF1C1C24),
                                    borderRadius:
                                        BorderRadius.circular(12),
                                  ),
                                  child: const Text(
                                    'Tap + to select multiple videos',
                                    textAlign: TextAlign.center,
                                    style: TextStyle(
                                      color: Colors.white54,
                                    ),
                                  ),
                                )
                              else
                                SizedBox(
                                  height: 112,
                                  child: ListView.builder(
                                    scrollDirection: Axis.horizontal,
                                    itemCount: clips.length,
                                    itemBuilder: (context, index) {
                                      final item = clips[index];
                                      final isSelected =
                                          index == selectedIndex;

                                      return GestureDetector(
                                        onTap: () => selectClip(index),
                                        child: Container(
                                          width: 155,
                                          margin: const EdgeInsets.only(
                                            right: 10,
                                          ),
                                          padding:
                                              const EdgeInsets.all(10),
                                          decoration: BoxDecoration(
                                            color: isSelected
                                                ? Colors.deepPurple
                                                    .withOpacity(0.35)
                                                : const Color(0xFF24242D),
                                            borderRadius:
                                                BorderRadius.circular(12),
                                            border: Border.all(
                                              color: isSelected
                                                  ? Colors.deepPurpleAccent
                                                  : Colors.white12,
                                              width: isSelected ? 2 : 1,
                                            ),
                                          ),
                                          child: Column(
                                            crossAxisAlignment:
                                                CrossAxisAlignment.start,
                                            children: [
                                              Row(
                                                children: [
                                                  const Icon(
                                                    Icons.video_file,
                                                    size: 18,
                                                  ),
                                                  const Spacer(),
                                                  GestureDetector(
                                                    onTap: () =>
                                                        removeClip(index),
                                                    child: const Icon(
                                                      Icons.close,
                                                      color: Colors.redAccent,
                                                      size: 20,
                                                    ),
                                                  ),
                                                ],
                                              ),
                                              const Spacer(),
                                              Text(
                                                item.name,
                                                maxLines: 2,
                                                overflow:
                                                    TextOverflow.ellipsis,
                                                style: const TextStyle(
                                                  fontSize: 12,
                                                ),
                                              ),
                                              const SizedBox(height: 4),
                                              Text(
                                                item.duration > 0
                                                    ? formatTime(
                                                        item.duration)
                                                    : 'Video',
                                                style: const TextStyle(
                                                  fontSize: 10,
                                                  color: Colors.white54,
                                                ),
                                              ),
                                            ],
                                          ),
                                        ),
                                      );
                                    },
                                  ),
                                ),

                              const SizedBox(height: 22),

                              const Text(
                                'TRIM SELECTED CLIP',
                                style: TextStyle(
                                  fontWeight: FontWeight.bold,
                                  letterSpacing: 1.2,
                                ),
                              ),

                              const SizedBox(height: 8),

                              if (clip != null &&
                                  clip.duration > 0)
                                Column(
                                  children: [
                                    RangeSlider(
                                      min: 0,
                                      max: maxDuration,
                                      values: RangeValues(
                                        clip.trimStart.clamp(
                                          0,
                                          maxDuration,
                                        ),
                                        clip.trimEnd.clamp(
                                          0,
                                          maxDuration,
                                        ),
                                      ),
                                      onChanged: (values) {
                                        if (values.end -
                                                values.start <
                                            0.1) {
                                          return;
                                        }
                                        updateTrim(values);
                                      },
                                    ),

                                    Row(
                                      mainAxisAlignment:
                                          MainAxisAlignment.spaceBetween,
                                      children: [
                                        Text(
                                          'IN: ${formatTime(clip.trimStart)}',
                                          style: const TextStyle(
                                            color: Colors.white70,
                                          ),
                                        ),
                                        Text(
                                          'OUT: ${formatTime(clip.trimEnd)}',
                                          style: const TextStyle(
                                            color: Colors.white70,
                                          ),
                                        ),
                                      ],
                                    ),
                                  ],
                                )
                              else
                                const Text(
                                  'Select a video to adjust trim points.',
                                  style: TextStyle(
                                    color: Colors.white54,
                                  ),
                                ),

                              const SizedBox(height: 22),

                              const Text(
                                'CROP RATIO',
                                style: TextStyle(
                                  fontWeight: FontWeight.bold,
                                  letterSpacing: 1.2,
                                ),
                              ),

                              const SizedBox(height: 10),

                              Wrap(
                                spacing: 8,
                                children: [
                                  'Original',
                                  '9:16',
                                  '16:9',
                                  '1:1',
                                ].map((ratio) {
                                  return ChoiceChip(
                                    label: Text(ratio),
                                    selected: cropRatio == ratio,
                                    onSelected: (_) {
                                      setState(() {
                                        cropRatio = ratio;
                                      });
                                    },
                                  );
                                }).toList(),
                              ),

                              const SizedBox(height: 22),

                              Container(
                                width: double.infinity,
                                padding: const EdgeInsets.all(12),
                                decoration: BoxDecoration(
                                  color: const Color(0xFF20202A),
                                  borderRadius:
                                      BorderRadius.circular(12),
                                ),
                                child: const Text(
                                  'VKOP EDITOR: Trim and crop settings are '
                                  'currently stored for editing. Final video '
                                  'export and AI background removal will be '
                                  'added in the next development stage.',
                                  style: TextStyle(
                                    fontSize: 12,
                                    color: Colors.white60,
                                  ),
                                ),
                              ),
                            ],
                          ),
                        ),
                      ),

                      Container(
                        padding: const EdgeInsets.all(12),
                        decoration: const BoxDecoration(
                          color: Color(0xFF1A1A22),
                          border: Border(
                            top: BorderSide(color: Colors.white12),
                          ),
                        ),
                        child: Row(
                          children: [
                            Expanded(
                              child: OutlinedButton.icon(
                                onPressed: pickVideos,
                                icon: const Icon(Icons.add),
                                label: const Text('Add Videos'),
                              ),
                            ),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VKOP-Android-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
